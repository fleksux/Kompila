<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>b2_reel_arco</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Serif:ital@0;1&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--berry:#B0124F;--pink:#FF1F7A;--rosa:#FF8DB8;--pessego:#FFC2A1;--lilas:#B99CF0;--creme:#F7F3EA;--grafite:#1d1a1f;--bebe:#FFF2F6;--ink:#1d1a1f;--mut:#5f5a63}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#bbb}
#pano{position:relative;height:1440px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink)}
.sl{position:absolute;top:0;width:1080px;height:1440px;overflow:hidden}
.x{position:absolute;z-index:6}            /* elemento que atravessa slides (coordenada do canvas) */
/* fundos */
.f-creme{background:var(--creme)}.f-bebe{background:var(--bebe)}.f-branco{background:#fff}
.f-lilas{background:#EEE6FF}.f-pessego{background:#FFE9DC}.f-rosa{background:#FFE1EC}
.f-berry{background:var(--berry);color:#fff}.f-pink{background:var(--pink);color:#fff}.f-grafite{background:var(--grafite);color:#fff}
.f-lilasf{background:var(--lilas);color:#fff}.f-pessegof{background:var(--pessego)}
/* topo e rodapé fixos */
.lg{position:absolute;left:96px;top:150px;height:58px;z-index:7}
.f-berry .lg,.f-pink .lg,.f-grafite .lg,.f-lilasf .lg{filter:drop-shadow(0 4px 14px rgba(0,0,0,.18))}
.pg{position:absolute;right:96px;top:164px;font:700 22px Inter;letter-spacing:.06em;opacity:.65;z-index:7}
.faixa{position:absolute;left:0;bottom:0;height:16px;z-index:8;background:linear-gradient(90deg,var(--berry) 0 20%,var(--pink) 20% 40%,var(--rosa) 40% 60%,var(--pessego) 60% 80%,var(--lilas) 80% 100%);background-size:1080px 16px}
.site{position:absolute;left:96px;bottom:150px;font:700 24px Inter;opacity:.7;z-index:7}
.seta{position:absolute;right:96px;bottom:150px;font:italic 400 40px 'Instrument Serif';z-index:7}
/* tipografia */
.k{font:800 22px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
.f-berry .k,.f-pink .k,.f-grafite .k,.f-lilasf .k{color:#fff;opacity:.85}
.t{font:800 92px/.96 'Bricolage Grotesque';letter-spacing:-.035em}
.t2{font:800 66px/1 'Bricolage Grotesque';letter-spacing:-.03em}
.t3{font:700 44px/1.08 'Bricolage Grotesque';letter-spacing:-.02em}
.m{font:italic 400 1.06em/1 'Instrument Serif';color:var(--pink);letter-spacing:-.01em}
.f-berry .m,.f-pink .m,.f-grafite .m{color:#FFD0E1}.f-lilasf .m{color:#fff}
.p{font:600 34px/1.38 Inter;color:var(--mut)}
.f-berry .p,.f-pink .p,.f-grafite .p,.f-lilasf .p{color:rgba(255,255,255,.86)}
.mao{font:italic 400 52px/1.05 'Instrument Serif';color:var(--berry)}
.f-berry .mao,.f-pink .mao,.f-grafite .mao{color:#FFD0E1}
.blk{position:absolute;left:96px;right:96px}
/* fotos */
.ft{position:absolute;overflow:hidden;border-radius:30px;background:#eee;box-shadow:0 20px 50px rgba(29,26,31,.16)}
.ft img,.ftc img,.pol img{width:100%;height:100%;object-fit:cover;display:block}
.ftc{position:absolute;overflow:hidden;border-radius:50%;box-shadow:0 18px 40px rgba(29,26,31,.18);border:10px solid #fff}
.pol{position:absolute;background:#fff;padding:16px 16px 64px;border-radius:6px;box-shadow:0 18px 44px rgba(29,26,31,.18)}
.pol i{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:italic 400 34px 'Instrument Serif';color:var(--berry)}
.full{position:absolute;inset:0}.full img{width:100%;height:100%;object-fit:cover}
.vel{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(180deg,rgba(29,26,31,0),rgba(29,26,31,.82) 70%)}
.velc{position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(180deg,rgba(247,243,234,0),var(--creme) 62%)}
/* peças */
.pill{display:inline-flex;align-items:center;gap:12px;height:72px;padding:0 30px;border-radius:99px;background:var(--pink);color:#fff;font:800 30px Inter}
.pill.br{background:#fff;color:var(--berry)}.pill.gr{background:var(--grafite)}
.num{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--pink);color:#fff;font:800 50px 'Bricolage Grotesque';flex:none}
.num.out{background:transparent;border:5px solid currentColor;color:var(--pink)}
.cartao{position:absolute;background:#fff;border-radius:30px;padding:34px 36px;box-shadow:0 16px 44px rgba(29,26,31,.12);color:var(--ink)}
.cartao .p{color:var(--mut)}
.preco{font:800 64px 'Bricolage Grotesque';letter-spacing:-.02em;color:var(--pink)}
.preco small{font:700 26px Inter;color:var(--mut);letter-spacing:0;margin-right:8px}
.estrela{color:#F5A623;letter-spacing:3px;font:800 30px Inter}
/* especialista: selo com foto redonda */
.esp{position:absolute;display:flex;align-items:center;gap:18px;z-index:7}
.esp .ftc{position:relative;width:110px;height:110px;border-width:6px}
.esp b{display:block;font:800 26px Inter}.esp small{display:block;font:600 22px Inter;opacity:.7}
.lista{list-style:none;display:flex;flex-direction:column;gap:26px}
.lista li{display:flex;gap:24px;align-items:flex-start;font:600 34px/1.3 Inter}
.lista li b{font-weight:800}
.lista .num{width:72px;height:72px;font-size:38px}
.bolha{position:absolute;background:#fff;border-radius:34px 34px 34px 8px;padding:30px 34px;font:600 32px/1.38 Inter;color:var(--ink);box-shadow:0 14px 36px rgba(29,26,31,.14)}
.bolha b{font-weight:800}
/* movimento (5 s por slide; o render grava em vídeo) */
@keyframes sobe{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes zoom{from{transform:scale(1.0)}to{transform:scale(1.09)}}
@keyframes flut{from{translate:0 0}to{translate:0 -16px}}
.sl .k,.sl .t,.sl .t2,.sl .t3,.sl .p,.sl .mao,.sl .pill,.sl .preco,.sl .cartao,.sl .bolha,.sl .lista li,.sl .num,.sl .esp{animation:sobe .9s cubic-bezier(.2,.8,.2,1) both}
.sl .k{animation-delay:.15s}.sl .t,.sl .t2{animation-delay:.3s}.sl .t3,.sl .mao{animation-delay:.45s}.sl .p,.sl .preco{animation-delay:.6s}
.sl .cartao,.sl .bolha{animation-delay:.75s}.sl .pill{animation-delay:.9s}
.sl .lista li:nth-child(1){animation-delay:.5s}.sl .lista li:nth-child(2){animation-delay:.7s}.sl .lista li:nth-child(3){animation-delay:.9s}.sl .lista li:nth-child(4){animation-delay:1.1s}.sl .lista li:nth-child(5){animation-delay:1.3s}
.ft img,.full img,.ftc img{animation:zoom 5s linear both}
.pol,.ftc,.x{animation:flut 2.5s ease-in-out infinite alternate}
.pol:nth-of-type(2n){animation-delay:-1.2s}
#reel{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink)}#reel .lg{top:390px}#reel .faixa{width:1080px}
.cena{position:absolute;inset:0;opacity:0;animation:cena 2.25s linear both}
@keyframes cena{0%{opacity:0}3%{opacity:1}97%{opacity:1}100%{opacity:0}}
.cena .foto{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden}
.cena .foto img{width:100%;height:100%;object-fit:cover;animation:zoom 2.3s linear both}
@keyframes zoom{from{transform:scale(1.02)}to{transform:scale(1.09)}}
.topo{position:absolute;left:96px;right:96px;top:300px;z-index:5;animation:topo 12s linear both}
@keyframes topo{0%,72%{opacity:1}75%,100%{opacity:0}}
.passo{position:absolute;left:96px;right:96px;top:1380px;display:flex;align-items:center;gap:28px;background:#fff;border-radius:30px;padding:30px 34px;box-shadow:0 18px 50px rgba(29,26,31,.18)}
.passo .num{width:110px;height:110px;font-size:60px}
.passo .frase{font:800 72px/1 'Bricolage Grotesque';letter-spacing:-.04em}
.fim{position:absolute;inset:0;background:var(--pink);padding:520px 96px 0;opacity:0;animation:fim 1.2s ease-out both;animation-delay:10.6s;z-index:8}
@keyframes fim{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.fim .p{color:rgba(255,255,255,.88)}
.barra{position:absolute;left:96px;right:96px;top:72px;height:8px;border-radius:9px;background:rgba(29,26,31,.12);overflow:hidden;z-index:9}
.barra i{display:block;height:100%;width:100%;background:var(--pink);transform-origin:left;animation:bar 12s linear both}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style></head><body><div id="reel" class="f-creme"><div class="cena" style="animation-delay:0.0s"><div class="foto"><img src="../../../tema/glowbos/img/montagem/a09_1.webp" style="animation-delay:0.0s"></div>
  <div class="passo"><span class="num">1</span><span class="frase">o primeiro cacho</span></div></div><div class="cena" style="animation-delay:2.2s"><div class="foto"><img src="../../../tema/glowbos/img/montagem/a09_2.webp" style="animation-delay:2.2s"></div>
  <div class="passo"><span class="num">2</span><span class="frase">mais uma cor</span></div></div><div class="cena" style="animation-delay:4.4s"><div class="foto"><img src="../../../tema/glowbos/img/montagem/a09_3.webp" style="animation-delay:4.4s"></div>
  <div class="passo"><span class="num">3</span><span class="frase">a curva aparece</span></div></div><div class="cena" style="animation-delay:6.6s"><div class="foto"><img src="../../../tema/glowbos/img/montagem/a09_4.webp" style="animation-delay:6.6s"></div>
  <div class="passo"><span class="num">4</span><span class="frase">arco montado</span></div></div><div class="cena" style="animation-delay:8.8s"><div class="foto"><img src="../especialista/pronto.jpg" style="animation-delay:8.8s"></div>
  <div class="passo"><span class="num">♥</span><span class="frase">festa pronta</span></div></div><div class="topo"><div class="k">tutorial</div><h1 class="t2">Arco de balões<br>em <span class="m">4 passos</span></h1></div>
<div class="fim"><h1 class="t" style="color:#fff;font-size:130px">Você<br><span class="m">consegue.</span></h1>
<p class="p" style="margin-top:30px">Kit de arco a partir de R$ 31,99, com as cores que você escolher. Chega hoje em SP e Grande SP.</p><span class="pill br" style="margin-top:50px">glowbos.com.br</span></div>
