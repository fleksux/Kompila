<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Glowbos votação</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,700;0,800;0,900;1,800&family=Inter:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Canvas panorâmico 12 x 1080 x 1440, cortado em slides (molde aprovado 08/10). Linha clara das refs do Vitor:
   foto real grande, fundo rosê claro, letra de mão, perfil de rede social. */
:root{--rosa:#FF1F7A;--pink2:#E0367A;--vinho:#8E1446;--rose:#FBEDF1;--rose2:#F6DCE4;--ink:#231b20;--cinza:#6f6168}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ccc}
#pano{position:relative;width:12960px;height:1440px;overflow:hidden;background:var(--rose);font-family:Inter,sans-serif;color:var(--ink)}
/* textura de papel e manchas de luz */
#pano:before{content:"";position:absolute;inset:0;background:radial-gradient(900px 700px at 300px 200px,#fff 0,transparent 70%),radial-gradient(800px 800px at 3500px 1200px,#fff6f9 0,transparent 70%),radial-gradient(900px 700px at 7000px 150px,#fff 0,transparent 70%),radial-gradient(900px 700px at 11800px 1300px,#fff 0,transparent 70%)}
/* fita de cetim atravessando todos os slides */
#fita{position:absolute;left:0;top:0;width:12960px;height:1440px;pointer-events:none;z-index:1}
.sl{position:absolute;top:0;width:1080px;height:1440px;z-index:2}
.logo{position:absolute;left:96px;top:64px;height:74px}
.pag{position:absolute;right:96px;top:84px;font:700 22px Inter;color:var(--cinza);letter-spacing:.04em}
/* capa */
.pol{position:absolute;background:#fff;padding:18px 18px 70px;box-shadow:0 18px 40px rgba(94,11,46,.16);border-radius:6px}
.pol img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px}
.pol i{position:absolute;left:0;right:0;bottom:16px;text-align:center;font:700 34px Caveat;color:var(--vinho);font-style:normal}
.fitinha{position:absolute;width:150px;height:40px;background:rgba(255,183,210,.85);top:-18px;left:50%;margin-left:-75px;transform:rotate(-4deg)}
.capa h1{position:absolute;left:96px;right:96px;top:930px;font:900 76px/1 "Inter Tight";letter-spacing:-.045em}
.capa h1 em{font:700 104px/0.8 Caveat;color:var(--rosa);letter-spacing:0;display:inline-block;transform:rotate(-3deg)}
.capa p{position:absolute;left:96px;right:110px;top:1160px;font:600 31px/1.35 Inter;color:#4b3f46}
.capa .arr{position:absolute;right:110px;bottom:80px;font:700 46px Caveat;color:var(--vinho)}
/* post de cliente */
.post{position:absolute;left:96px;right:96px;top:170px;bottom:170px;background:#fff;border-radius:34px;box-shadow:0 22px 60px rgba(94,11,46,.13);overflow:hidden;display:flex;flex-direction:column}
.post .hd{display:flex;align-items:center;gap:20px;padding:28px 32px}
.av{width:86px;height:86px;border-radius:50%;padding:4px;background:conic-gradient(from 200deg,#FFB86B,#FF1F7A,#C13584,#FFB86B);flex:none}
.av span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:4px solid #fff;overflow:hidden;background:#fde0ea;font:800 34px Inter;color:var(--vinho);text-transform:uppercase}
.av img{width:100%;height:100%;object-fit:cover}
.hd b{display:block;font:800 32px Inter;letter-spacing:-.01em}
.hd small{display:block;font:600 24px Inter;color:var(--cinza);margin-top:4px}
.ft{position:relative;flex:1;min-height:0}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;right:26px;top:26px;width:150px;height:150px;border-radius:50%;background:var(--rosa);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 12px 30px rgba(255,31,122,.4);transform:rotate(8deg)}
.num small{display:block;font:800 20px Inter;letter-spacing:.12em;text-transform:uppercase;margin-bottom:-6px}
.num b{display:block;font:900 76px/1 "Inter Tight"}
.ac{display:flex;gap:26px;align-items:center;padding:24px 32px 6px}
.ac svg{width:46px;height:46px;stroke:var(--ink);fill:none;stroke-width:1.8}
.ac svg.cor{fill:var(--rosa);stroke:var(--rosa)}
.ac .st{margin-left:auto;font:800 30px Inter;color:#F5A623;letter-spacing:2px}
.tx{padding:8px 32px 34px;font:500 31px/1.38 Inter;color:#3a3036}
.tx b{font-weight:800;color:var(--ink);margin-right:8px}
.nota{position:absolute;left:110px;bottom:80px;font:700 44px Caveat;color:var(--vinho)}
/* final */
.fim h2{position:absolute;left:96px;right:96px;top:190px;font:900 100px/.96 "Inter Tight";letter-spacing:-.045em}
.fim h2 em{font:700 124px/.8 Caveat;color:var(--rosa);letter-spacing:0}
.fim .gr{position:absolute;left:96px;right:96px;top:380px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.fim .gr div{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px rgba(94,11,46,.14)}
.fim .gr img{width:100%;height:100%;object-fit:cover}
.fim .gr b{position:absolute;left:10px;top:10px;width:54px;height:54px;border-radius:50%;background:var(--rosa);color:#fff;display:grid;place-items:center;font:900 30px "Inter Tight"}
.fim .cm{position:absolute;left:96px;right:96px;top:930px;background:#fff;border-radius:30px;padding:30px 34px;display:flex;align-items:center;gap:22px;box-shadow:0 14px 40px rgba(94,11,46,.12)}
.fim .cm .av{width:76px;height:76px}
.fim .cm p{font:500 32px/1.35 Inter;color:#3a3036}
.fim .cm p b{font-weight:800;color:var(--ink)}
.fim .cm p i{font-style:normal;color:var(--rosa);font-weight:800}
.fim .ob{position:absolute;left:96px;right:96px;top:1130px;font:700 50px/1.1 Caveat;color:var(--vinho)}
</style></head><body>
<div id="pano">
  <svg id="fita" viewBox="0 0 12960 1440" preserveAspectRatio="none"><path id="fp" d="" fill="none" stroke="#FF8DB8" stroke-width="16" stroke-linecap="round" opacity=".55"/></svg>
</div>
<script>
var D=[{"f":"hd/r010.jpg","n":"aniellybruna","c":"A bolas são lindas, bem fortes, não são aquelas bexigas fracas. E chegou rápido bem antes do esperado.","p":"Pacote 75 balões"},
{"f":"hd/r012.jpg","n":"suelayneramaia","c":"Os balões são ótimos e as cores são lindas eu amei","p":"Pacote 75 balões"},
{"f":"hd/r038.jpg","n":"cydarosa","c":"O produto é de boa qualidade.","p":"Pacote 100 balões"},
{"f":"hd/r030.jpg","n":"thyrzanathanaelly465","c":"Top! Super amei! Entrega super rápida e bem embalado","p":"Pacote 50 balões"},
{"f":"hd/r032.jpg","n":"julinhamakes","c":"Ótimas bexigas, são firmes e resistentes.","p":"Pacote 50 balões"},
{"f":"hd/r027.jpg","n":"cckyawub7f","c":"Os balões são ótimos, cores bem vivas. Aprovado.","p":"Pacote 75 balões"},
{"f":"hd/r042.jpg","n":"talinejn","c":"Vem uma fita que facilita muito. Cores vivas e a qualidade das bexigas são boas","p":"Kit arco 60 peças"},
{"f":"hd/r015.jpg","n":"daysepedagoga","c":"Vale muuuuuito a pena, os balões são os maiores que estão na foto. Pensa numa qualidade!","p":"Pacote 75 balões"},
{"f":"hd/r048.jpg","n":"luryanlizylemosfelisbert","c":"Chegaram antes do aniversário pra mim poder me organizar, amei as cores, ótima qualidade.","p":"Pacote 50 balões"},
{"f":"hd/r006.jpg","n":"alinefereirasouza","c":"Os balões são de excelente qualidade e cores vivas lindos recomendo.","p":"Pacote 75 balões"}];
var AV={"suelayneramaia": "o-m4n8wpfot5px51.webp", "cydarosa": "a-mlnnb7cqccg603.webp", "julinhamakes": "g-mq1enyrhzbwje5.webp", "talinejn": "f558970ab7c7368e.webp", "daysepedagoga": "o-m872dullfsb503.webp", "luryanlizylemosfelisbert": "o-mazuz16prl6hec.webp", "alinefereirasouza": "75f258a43e4e4be2.webp"};
var P=document.getElementById('pano'),N=D.length+2;
function sl(i,cls,html){var s=document.createElement('section');s.className='sl '+cls;s.style.left=(i*1080)+'px';s.innerHTML=html;P.appendChild(s);return s}
var LOGO='<img class="logo" src="logo.png" alt="Glowbos">';
var heart='<svg class="cor" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.2 3 4.5 6.6 4.5c2.2 0 3.6 1.2 5.4 3.2 1.8-2 3.2-3.2 5.4-3.2 3.6 0 5.7 3.7 4.2 7.2C19.5 16.4 12 21 12 21z"/></svg>';
var com='<svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-3.6-6.9A8.4 8.4 0 0 1 20.5 12l1 8-5.3-2.2"/></svg>';
var send='<svg viewBox="0 0 24 24"><path d="M22 3 9.5 13.5M22 3l-7 18-4.5-7.5L3 9z"/></svg>';
// 1 capa: polaroids das festas
var pol=[[60,180,420,440,-7,0],[530,160,450,470,5,1],[130,560,380,330,4,7],[590,580,390,310,-5,8]];
sl(0,'capa',LOGO+'<span class="pag">Votação ♥</span>'+pol.map(function(q){return '<div class="pol" style="left:'+q[0]+'px;top:'+q[1]+'px;width:'+q[2]+'px;height:'+q[3]+'px;transform:rotate('+q[4]+'deg)"><span class="fitinha"></span><img src="'+D[q[5]].f+'"><i>festa '+(q[5]+1)+'</i></div>'}).join('')
 +'<h1>Obrigado por deixar a gente entrar na sua <em>festa</em></h1><p>Essas fotos foram vocês que mandaram. Agora ajuda a gente a escolher a mais linda.</p><span class="arr">arrasta pro lado →</span>');
// 2 a 11 posts dos clientes
D.forEach(function(x,k){
  var ini=x.n.replace(/[^a-z]/gi,'').charAt(0);
  sl(k+1,'cli',LOGO+'<span class="pag">'+(k+1)+' de '+D.length+'</span>'
   +'<div class="post"><div class="hd"><span class="av"><span>'+(AV[x.n]?'<img src="perfil/'+AV[x.n]+'">':ini)+'</span></span><div><b>'+x.n+'</b><small>comprou '+x.p+'</small></div></div>'
   +'<div class="ft"><img src="'+x.f+'"><span class="num"><span><small>festa</small><b>'+(k+1)+'</b></span></span></div>'
   +'<div class="ac">'+heart+com+send+'<span class="st">★★★★★</span></div>'
   +'<p class="tx"><b>'+x.n+'</b>'+x.c+'</p></div>'
   +'<span class="nota">'+(k<D.length-1?'gostou? guarda o número '+(k+1)+' ♥':'qual foi a sua favorita?')+'</span>');
});
// 12 final
sl(N-1,'fim',LOGO+'<span class="pag">Vote ♥</span><h2>Qual é a <em>mais linda?</em></h2>'
 +'<div class="gr">'+D.map(function(x,k){return '<div><img src="'+x.f+'"><b>'+(k+1)+'</b></div>'}).join('')+'</div>'
 +'<div class="cm"><span class="av"><span>V</span></span><p><b>você</b> eu voto na <i>festa ...</i> ♥</p></div>'
 +'<p class="ob">Comenta o número da sua favorita. Obrigado por cada festa que vocês fizeram com a Glowbos ♥</p>');
// fita: onda contínua passando atrás dos posts
var d='M -40 1340',W=12960;for(var x=0;x<=W;x+=540){d+=' Q '+(x+270)+' '+(x/540%2?1395:1290)+' '+(x+540)+' 1340'}
document.getElementById('fp').setAttribute('d',d);
</script>
</body></html>
