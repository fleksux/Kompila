<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 layouts Glowbos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#FFF5F9;font:15px Nunito,sans-serif;color:#1a1418}
header{position:sticky;top:0;z-index:5;background:#F93388;color:#fff;padding:18px 24px;display:flex;align-items:center;gap:20px}header h1{font:700 26px Fredoka;margin:0;flex:1}
button{font:800 14px Nunito;border:0;border-radius:99px;padding:10px 18px;background:#fff;color:#F93388;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding:24px;max-width:1500px;margin:0 auto}
figure{margin:0;cursor:zoom-in}.w{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(249,51,136,.15)}.w img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{margin-top:8px;font:600 15px Nunito}figcaption b{font:700 18px Fredoka;color:#F93388;margin-right:6px}
.gz{display:none;position:absolute;inset:10.4% 8.9%;border:2px dashed #00AEEF;pointer-events:none}body.guia .gz{display:block}
#z{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:9}#z.on{display:grid}#z .w{height:92vh;aspect-ratio:3/4}</style></head><body>
<header><h1>20 layouts · mesma foto, mesmo texto</h1><button id="gb">Guias</button></header><div class="g"><figure data-n="1"><div class="w"><img src="png/l01.png" loading="lazy"><div class="gz"></div></div><figcaption><b>01</b> Editorial</figcaption></figure><figure data-n="2"><div class="w"><img src="png/l02.png" loading="lazy"><div class="gz"></div></div><figcaption><b>02</b> Polaroid</figcaption></figure><figure data-n="3"><div class="w"><img src="png/l03.png" loading="lazy"><div class="gz"></div></div><figcaption><b>03</b> Dividido</figcaption></figure><figure data-n="4"><div class="w"><img src="png/l04.png" loading="lazy"><div class="gz"></div></div><figcaption><b>04</b> Arco</figcaption></figure><figure data-n="5"><div class="w"><img src="png/l05.png" loading="lazy"><div class="gz"></div></div><figcaption><b>05</b> Círculo com texto girando</figcaption></figure><figure data-n="6"><div class="w"><img src="png/l06.png" loading="lazy"><div class="gz"></div></div><figcaption><b>06</b> Capa de revista</figcaption></figure><figure data-n="7"><div class="w"><img src="png/l07.png" loading="lazy"><div class="gz"></div></div><figcaption><b>07</b> Adesivos</figcaption></figure><figure data-n="8"><div class="w"><img src="png/l08.png" loading="lazy"><div class="gz"></div></div><figcaption><b>08</b> Conversa de WhatsApp</figcaption></figure><figure data-n="9"><div class="w"><img src="png/l09.png" loading="lazy"><div class="gz"></div></div><figcaption><b>09</b> Foto dentro da palavra</figcaption></figure><figure data-n="10"><div class="w"><img src="png/l10.png" loading="lazy"><div class="gz"></div></div><figcaption><b>10</b> Mosaico</figcaption></figure><figure data-n="11"><div class="w"><img src="png/l11.png" loading="lazy"><div class="gz"></div></div><figcaption><b>11</b> Cartão no pôr do sol</figcaption></figure><figure data-n="12"><div class="w"><img src="png/l12.png" loading="lazy"><div class="gz"></div></div><figcaption><b>12</b> Neon</figcaption></figure><figure data-n="13"><div class="w"><img src="png/l13.png" loading="lazy"><div class="gz"></div></div><figcaption><b>13</b> Halloween</figcaption></figure><figure data-n="14"><div class="w"><img src="png/l14.png" loading="lazy"><div class="gz"></div></div><figcaption><b>14</b> Ingresso</figcaption></figure><figure data-n="15"><div class="w"><img src="png/l15.png" loading="lazy"><div class="gz"></div></div><figcaption><b>15</b> Celular na mão</figcaption></figure><figure data-n="16"><div class="w"><img src="png/l16.png" loading="lazy"><div class="gz"></div></div><figcaption><b>16</b> Branco e ar</figcaption></figure><figure data-n="17"><div class="w"><img src="png/l17.png" loading="lazy"><div class="gz"></div></div><figcaption><b>17</b> Duotone rosa</figcaption></figure><figure data-n="18"><div class="w"><img src="png/l18.png" loading="lazy"><div class="gz"></div></div><figcaption><b>18</b> Três balões</figcaption></figure><figure data-n="19"><div class="w"><img src="png/l19.png" loading="lazy"><div class="gz"></div></div><figcaption><b>19</b> Calendário</figcaption></figure><figure data-n="20"><div class="w"><img src="png/l20.png" loading="lazy"><div class="gz"></div></div><figcaption><b>20</b> Faixa + 2 botões</figcaption></figure></div><div id="z"></div>
<script>document.getElementById('gb').onclick=()=>document.body.classList.toggle('guia');
document.querySelectorAll('figure').forEach(f=>f.onclick=()=>{const z=document.getElementById('z');z.innerHTML=f.querySelector('.w').outerHTML;z.classList.add('on')});
document.getElementById('z').onclick=e=>e.currentTarget.classList.remove('on');</script></body></html>
