<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Prospecção · Kompila</title>
<link rel="icon" href="img/liz_rosto_3d.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="fora">

<div id="vp"><div id="world"><svg id="wires"></svg></div></div>

<div class="top">
  <div class="pill"><div class="logo">[ <i>kompila</i> ]</div><div class="sepv"></div><div class="file">Prospecção <span id="fname"></span></div></div>
  <div class="pill" style="padding:0 4px" id="pHist" hidden><button class="ibtn" id="bHist" title="Buscas anteriores" aria-label="Buscas anteriores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 109-9 9.7 9.7 0 00-6.7 2.8L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button><button class="ibtn" id="bLista" title="Ver como lista" aria-label="Ver como lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></button><button class="ibtn" id="bNova" title="Nova busca" aria-label="Nova busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="pill" style="margin-left:auto" id="pUser" hidden><div class="live"><div class="dot off" id="dot"></div><span id="liveTx">Liz parada</span></div><img class="av" id="av" alt="" referrerpolicy="no-referrer"><span class="av av-l" id="avL" hidden></span><button class="ibtn" id="bSair" title="Sair" aria-label="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4H5a1 1 0 00-1 1v14a1 1 0 001 1h4M16 17l5-5-5-5M21 12H9"/></svg></button></div>
  <div class="pill" style="padding:0 4px" id="pZoom" hidden><button class="ibtn" id="zf" title="Ver tudo" aria-label="Ver tudo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
</div>
<div class="hist" id="hist"></div>

<!-- login -->
<div class="over" id="login" hidden>
  <div class="card">
    <img src="img/liz_fala_3d.png" alt="Liz">
    <div>
      <div class="stp">Prospecção da Kompila</div>
      <h2>Oi, eu sou a Liz.<br>Bora achar <em>cliente bom</em> hoje?</h2>
      <p class="sub">Eu procuro empresas, leio o Google, o site e as avaliações, e te entrego a capivara de cada uma com a abordagem pronta. Nada sai sem o seu ok.</p>
      <button class="gbtn" id="bGoogle"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 01-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.7 14.1a6.6 6.6 0 010-4.2V7.1H2.1a11 11 0 000 9.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 002.1 7.1l3.6 2.8C6.6 7.3 9.1 5.4 12 5.4z"/></svg>Entrar com o Google</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- pergunta -->
<div class="over" id="ask" hidden><div class="card"><img src="img/liz_fala_3d.png" alt="Liz"><div id="askc"></div></div></div>
<input type="file" id="arq" accept=".xlsx,.xls,.csv" hidden>

<div class="reply" id="reply"><div class="in"><img src="img/liz_rosto_3d.png" alt=""><div id="replyTx"></div></div></div>
<div class="bar">
  <img src="img/liz_rosto_3d.png" alt="">
  <input id="inp" placeholder="Fala com a Liz. Ex: padaria em Santos" autocomplete="off">
  <button class="btn go" id="bEnv">Enviar</button>
</div>

<div class="cap-o" id="capO"></div>
<aside class="cap" id="cap" aria-label="Capivara"></aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
