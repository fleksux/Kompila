<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kompila · liz · no celular</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{height:100%;margin:0}
body{background:#1A1D22;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;color:#8A939C;overflow:hidden}
.stage{display:grid;grid-template-columns:auto auto;gap:40px;align-items:center;transform:scale(var(--z,1));transform-origin:center}
.phone{width:390px;height:844px;background:#000;border-radius:54px;padding:14px;box-shadow:0 40px 100px -30px rgba(0,0,0,.9),0 0 0 2px #2A2F36;position:relative}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:2}
.screen{width:100%;height:100%;border-radius:42px;overflow:hidden;background:#0A0B0E}
iframe{width:390px;height:816px;border:0;display:block}
.side{font-size:12px;line-height:2;letter-spacing:.06em;text-transform:uppercase;max-width:220px}
.side b{color:#2FD67B;font-weight:600;display:block;font-size:14px;margin-bottom:8px}
.side a{color:#E9EBEE;text-decoration:none;border-bottom:1px solid #3A424B}
.side .w{display:flex;gap:8px;margin-top:14px}
.side button{font:600 12px "JetBrains Mono",monospace;background:transparent;color:#E9EBEE;border:1px solid #3A424B;padding:8px 10px;cursor:pointer}
.side button.on{border-color:#2FD67B;color:#2FD67B}
@media(max-width:700px){body{overflow:auto;place-items:start center}.stage{grid-template-columns:1fr;padding:20px 0}.phone{transform:scale(.9);transform-origin:top center}.side{display:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="screen"><iframe id="f" src="./" title="kompila no celular"></iframe></div></div>
  <div class="side">
    <b>[ kompila ] · liz</b>
    390 × 844 · iPhone 14/15<br>
    rola dentro do aparelho<br>
    <div class="w"><button class="on" data-w="390">390</button><button data-w="360">360</button><button data-w="430">430</button></div>
    <br><a href="./" target="_blank">abrir sem moldura</a>
  </div>
</div>
<script>
// encolhe o aparelho pra caber na janela (844px + folga), senão o rodapé dele, onde fica o chat, sai da tela
function cabe(){var z=Math.min(1,(innerHeight-32)/884);document.querySelector('.stage').style.setProperty('--z',z.toFixed(3))}
cabe();addEventListener('resize',cabe);
document.querySelectorAll('.side button').forEach(function(b){b.addEventListener('click',function(){
  var w=+b.dataset.w;document.querySelector('.phone').style.width=w+'px';document.getElementById('f').style.width=w+'px';
  document.querySelectorAll('.side button').forEach(function(x){x.classList.toggle('on',x===b)});
})});
</script>
</body>
</html>
