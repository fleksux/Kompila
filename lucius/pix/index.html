<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="/lucius/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pagar no Pix · Luciu's Lanches</title>
<meta name="theme-color" content="#0e0e0e">
<link rel="icon" href="img/icone_192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--preto:#0e0e0e;--parede:#161616;--laranja:#F75C21;--amarelo:#F8BF51;--creme:#F4EFE6;--tinta:#1d1712;--cinza:#9a958c;--linha:#2a2a2a;--verde:#3ccf7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--preto);color:var(--creme);font-family:Barlow,system-ui,sans-serif;min-height:100%}
main{max-width:440px;margin:0 auto;padding:28px 16px calc(32px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.logo{width:150px;height:auto}
.cartao{width:100%;background:var(--creme);color:var(--tinta);border-radius:20px;padding:24px 20px 22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rot{font:700 13px/1 Barlow,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7a7268}
.num{font:400 22px/1 Anton,sans-serif;letter-spacing:.02em}
.total{font:400 54px/1 Anton,sans-serif;color:var(--laranja)}
.qr{background:#fff;border-radius:14px;padding:12px;line-height:0}
.qr svg{width:220px;height:220px;display:block}
.bt{width:100%;border:0;border-radius:14px;background:var(--laranja);color:#fff;font:800 18px/1 Barlow,sans-serif;padding:18px;cursor:pointer;transition:transform .12s,background .2s}
.bt:active{transform:scale(.98)}
.bt.ok{background:var(--verde)}
.codigo{width:100%;font:600 11px/1.45 'JetBrains Mono',monospace;color:#5d564d;word-break:break-all;background:#ebe4d8;border-radius:10px;padding:10px 12px;text-align:left;max-height:72px;overflow:hidden}
.passos{width:100%;text-align:left;color:var(--creme);font:500 15px/1.45 Barlow,sans-serif;display:grid;gap:8px;counter-reset:p}
.passos li{list-style:none;display:flex;gap:10px;align-items:flex-start}
.passos li::before{counter-increment:p;content:counter(p);flex:0 0 24px;height:24px;border-radius:50%;background:var(--amarelo);color:var(--tinta);font:800 13px/24px Barlow,sans-serif;text-align:center}
.msg{color:var(--cinza);font:500 15px/1.5 Barlow,sans-serif;padding:40px 8px}
.rodape{color:#6b665e;font:500 12px/1 Barlow,sans-serif;margin-top:6px}
.rodape a{color:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <img class="logo" src="img/LUCIUS_logo_vetor_branco.svg" alt="Luciu's Lanches">
  <p class="msg" id="msg">Carregando o Pix do seu pedido…</p>
  <section class="cartao" id="cartao" hidden>
    <span class="rot">Pagamento no Pix</span>
    <span class="num" id="num"></span>
    <span class="total" id="total"></span>
    <div class="qr" id="qr" aria-label="QR Code do Pix"></div>
    <button class="bt" id="copiar" type="button">Copiar código Pix</button>
    <div class="codigo" id="codigo"></div>
  </section>
  <ol class="passos" id="passos" hidden>
    <li>Toque em <b>Copiar código Pix</b>.</li>
    <li>Abra o app do seu banco, entre em Pix e escolha <b>Pix Copia e Cola</b>.</li>
    <li>Cole o código e confirme. O valor já vem preenchido.</li>
  </ol>
  <p class="rodape"><a href="https://kompila.com.br" target="_blank" rel="noopener">[ kompila ]</a> · 2026</p>
</main>
<script>
const PEDIDO_URL = 'https://fmbxnfebumfhrviumkbu.supabase.co/functions/v1/pedido'
const $ = s => document.querySelector(s)
const R = n => 'R$ ' + Number(n).toFixed(2).replace('.', ',')
const id = new URLSearchParams(location.search).get('p') || ''
async function carregar() {
  if (!/^[0-9a-f-]{36}$/.test(id)) { $('#msg').textContent = 'Link do Pix incompleto. Pede de novo pra Liz no WhatsApp.'; return }
  let j = null
  try { const r = await fetch(PEDIDO_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ chave: 'kmp_lucius_lanches', acao: 'pix', pedido_id: id }) }); j = await r.json() } catch (e) {}
  if (!j || !j.ok) { $('#msg').textContent = (j && j.erro ? j.erro.charAt(0).toUpperCase() + j.erro.slice(1) + '.' : 'Não deu pra abrir o Pix agora.') + ' Fala com a Liz no WhatsApp.'; return }
  $('#num').textContent = 'Pedido nº ' + j.numero
  $('#total').textContent = R(j.total)
  $('#codigo').textContent = j.copia
  try { const q = qrcode(0, 'M'); q.addData(j.copia); q.make(); $('#qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true }) } catch (e) { $('#qr').hidden = true }
  $('#copiar').onclick = async () => {
    let ok = false
    try { await navigator.clipboard.writeText(j.copia); ok = true } catch (e) {
      const t = document.createElement('textarea'); t.value = j.copia; document.body.appendChild(t); t.select(); try { ok = document.execCommand('copy') } catch (e2) {} t.remove()
    }
    const b = $('#copiar'); b.textContent = ok ? 'Código copiado! Agora cola no banco' : 'Segura o código abaixo pra copiar'; b.classList.toggle('ok', ok)
  }
  $('#msg').hidden = true; $('#cartao').hidden = false; $('#passos').hidden = false
}
carregar()
</script>
</body>
</html>
