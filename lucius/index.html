<style>
:root{--fundo:#F7F2EA;--tinta:#1d1712;--preto:#0e0e0e;--parede:#161616;--tijolo:#1d1d1d;--laranja:#F75C21;--amarelo:#F8BF51;--creme:#F4EFE6;--cinza:#9a958c;--linha:#2a2a2a;--verde:#3ccf7a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{background:var(--fundo);color:var(--tinta);font-family:Barlow,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:110px}
body.trava{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* parede de tijolo, igual ao logo */
.tijolo{background-color:var(--parede);background-image:
  linear-gradient(90deg,rgba(0,0,0,.55) 2px,transparent 2px),linear-gradient(rgba(0,0,0,.55) 2px,transparent 2px),
  linear-gradient(90deg,rgba(0,0,0,.55) 2px,transparent 2px);
  background-size:64px 32px,64px 32px,64px 32px;background-position:0 0,0 0,32px 16px}
/* topo: ícone do logo + "Mate sua fome" + seta (Alex 19/10) */
.hero{position:relative;overflow:hidden;padding:14px 0 26px;text-align:center;color:var(--creme)}
.hero{background:#0e0e0e url(img/hero_lanche.webp) center 30%/cover no-repeat;min-height:min(78vh,560px);display:flex;flex-direction:column}
.hero::after{content:"";position:absolute;inset:0;background:rgba(10,8,6,.38);pointer-events:none}
.hero .wrap{flex:1;display:flex;flex-direction:column;width:100%}
.hero .baixo{margin-top:auto}
.hero .wrap{position:relative;z-index:1}
.topo-l{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topo-l img{width:74px}
.status{display:inline-flex;align-items:center;gap:8px;font:700 13px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.55);border:1px solid #2a2a2a;padding:7px 12px;border-radius:99px;color:var(--creme)}
.status i{width:9px;height:9px;border-radius:50%;background:#9a958c}
.status.aberto i{background:var(--verde);animation:pulso 2s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(60,207,122,.6)}70%{box-shadow:0 0 0 9px rgba(60,207,122,0)}100%{box-shadow:0 0 0 0 rgba(60,207,122,0)}}

@keyframes entra{from{transform:scale(.6) rotate(-8deg);opacity:0}}
.hero h1{text-shadow:0 4px 24px rgba(0,0,0,.7);font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(46px,14vw,80px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:var(--creme);margin-top:12px}
.hero h1 b{color:var(--laranja);font-weight:400;text-shadow:0 0 22px rgba(247,92,33,.5)}
.hero .info{color:#f1e9dd;font-size:15px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.comece{margin:16px auto 0;width:52px;height:52px;border-radius:50%;background:var(--laranja);color:#1a0b04;display:grid;place-items:center;box-shadow:0 10px 26px rgba(247,92,33,.4);animation:pula 1.8s ease-in-out infinite}
.comece svg{width:24px;height:24px}
@keyframes pula{50%{transform:translateY(7px)}}
.repetir{margin:16px auto 0;display:none;width:100%;text-align:left;background:linear-gradient(90deg,rgba(247,92,33,.2),rgba(247,92,33,.06));border:1px solid rgba(247,92,33,.45);border-radius:14px;padding:10px 14px;color:var(--creme)}
.repetir b{display:block;font:700 16px 'Barlow Condensed';letter-spacing:.04em;text-transform:uppercase;color:var(--laranja)}
.repetir small{color:#cfc8bc}
/* busca e abas */
.barra{position:sticky;top:0;z-index:20;background:rgba(247,242,234,.94);backdrop-filter:blur(10px);border-bottom:1px solid #e6ddcf}
.busca{position:relative;display:block;margin:18px 0 14px}
.busca input{width:100%;height:52px;border-radius:14px;border:1px solid #e3d9c9;background:#fff;padding:0 16px 0 46px;font-size:16px;outline:none}
.busca input:focus{border-color:var(--laranja)}
.busca svg{position:absolute;left:15px;top:16px;width:20px;height:20px;stroke:var(--cinza)}
.abas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 14px}
.abas::-webkit-scrollbar{display:none}
.abas button{flex:none;font:700 15px 'Barlow Condensed';letter-spacing:.05em;text-transform:uppercase;padding:10px 16px;border-radius:99px;border:1px solid #e3d9c9;color:#6b6155;white-space:nowrap}
.abas button.on{background:var(--laranja);border-color:var(--laranja);color:#1a0b04}
.filtros{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:none;font-size:14px;font-weight:600;padding:9px 14px;border-radius:99px;background:#efe6d8;color:#5e5449}
.filtros button.on{background:var(--amarelo);color:#1a1205}
/* cardápio */
section.cat{padding:26px 0 6px}
section.cat h2{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
section.cat h2 small{font:600 14px Barlow;color:#8a7f72;text-transform:none;letter-spacing:0}
.destaques{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:14px 0 4px;scroll-snap-type:x mandatory}
.destaques::-webkit-scrollbar{display:none}
.dest{flex:none;width:calc((100% - 12px) / 2);scroll-snap-align:start;text-align:left;border-radius:18px;overflow:hidden;background:#fff;border:1px solid #eadfce;box-shadow:0 6px 18px rgba(60,40,20,.08)}
.dest img{width:100%;aspect-ratio:1;height:auto;object-fit:cover}
.dest div{padding:10px 12px 12px}
.dest b{display:block;font:700 18px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.dest span{color:#C2410C;font-weight:800}
.lista{display:grid;gap:10px;margin-top:14px}
.item{contain:layout paint;display:grid;grid-template-columns:1fr 104px;gap:14px;align-items:stretch;min-height:128px;text-align:left;padding:12px;border-radius:16px;background:#fff;border:1px solid #eadfce;box-shadow:0 4px 14px rgba(60,40,20,.05);transition:transform .15s,border-color .15s}
.item:active{transform:scale(.985)}

.item img{align-self:center}
.item h3{font:700 19px 'Barlow Condensed';letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.item p{color:#7a6f63;font-size:14px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .preco{margin-top:8px;font-weight:800;font-size:17px;color:#C2410C}
.item .tag{display:inline-block;margin-left:6px;font:700 11px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:#1a0b04;background:var(--laranja);padding:2px 6px;border-radius:5px;vertical-align:2px}
.item img{width:104px;height:104px;object-fit:cover;border-radius:12px}
.item .qtd{display:inline-block;margin-left:8px;font-size:13px;color:#15803d;font-weight:700}
.vazio{padding:40px 0;text-align:center;color:#8a7f72}
.rodape{padding:40px 0 20px;color:#8a7f72;font-size:13px;text-align:center}
.rodape a{color:#5e5449}
/* barra do carrinho */
/* barra do pedido no celular (19/10, Alex: "o carrinho laranja está escroto"): grafite, foto do último item, contagem e total discretos, CTA claro */
.sacola{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;max-width:736px;margin:0 auto;display:none;align-items:center;gap:12px;background:#1d1712;color:#F4EFE6;border-radius:18px;padding:8px 8px 8px 10px;box-shadow:0 16px 40px rgba(29,23,18,.35);animation:sobe .35s cubic-bezier(.2,.9,.3,1.2);text-align:left}
.sacola.on{display:flex}
@keyframes sobe{from{transform:translateY(120%)}}
.sacola .mini{position:relative;width:44px;height:44px;flex:none}
.sacola .mini img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.sacola .mini i{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--laranja);color:#1a0b04;font:800 12px Barlow;font-style:normal;display:grid;place-items:center;border:2px solid #1d1712}
.sacola .txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.sacola .txt small{font-size:12px;color:#b9ae9f;font-weight:600}
.sacola .txt strong{font-size:18px;font-weight:800}
.sacola .ir{margin-left:auto;height:44px;padding:0 16px;border-radius:12px;background:var(--laranja);color:#1a0b04;display:flex;align-items:center;gap:6px;font:700 17px 'Barlow Condensed';letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.sacola .ir svg{width:16px;height:16px}
/* coluna do pedido no computador */
.lado{display:none}
@media (min-width:1000px){
  .barra .wrap,main.wrap,.rodape.wrap{max-width:1180px;padding-right:396px}
  .sacola,.sacola.on{display:none}
  .lado{display:flex;flex-direction:column;position:fixed;z-index:25;top:24px;bottom:24px;right:max(16px,calc((100vw - 1180px) / 2 + 16px));width:360px;background:#fff;border:1px solid #eadfce;border-radius:22px;box-shadow:0 18px 50px rgba(60,40,20,.10);color:var(--tinta);overflow:hidden;transition:top .2s}
  .lado header{padding:18px 20px 10px;display:flex;align-items:baseline;gap:8px}
  .lado header h3{font:400 28px Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
  .lado header span{color:#8a7f72;font-size:14px;font-weight:600}
  .lado .itens{flex:1;overflow-y:auto;padding:0 20px}
  .lado .li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0e8dc}
  .lado .li img,.lado .li .ph2{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#F75C21}
  .lado .li b{display:block;font:700 16px 'Barlow Condensed';text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
  .lado .li small{display:block;color:#8a7f72;font-size:12.5px;line-height:1.3;margin-top:2px}
  .lado .li .v{text-align:right;font-weight:800;color:#C2410C;font-size:15px}

/* aberto ou fechado, pela hora de Abaeté (mesmo fuso de Brasília) */
function status() {
  const h = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' })), m = h.getHours() * 60 + h.getMinutes()
  const aberto = m >= 17 * 60 + 30 && m <= 23 * 60 + 59
  const s = $('#status'); s.classList.toggle('aberto', aberto); s.querySelector('em').textContent = aberto ? 'Aberto agora' : 'Abre às 17h30'
}

const sem = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()

function cartao(i) {
  const n = sacola.filter(x => x.id === i.id).reduce((a, x) => a + x.qtd, 0)
  return `<button class="item" data-id="${i.id}"><div><h3>${esc(i.nome)}${i.mais ? '<span class="tag">mais pedido</span>' : ''}</h3>${i.desc ? `<p>${esc(i.desc)}</p>` : ''}<div class="preco">${R(i.preco)}${n ? `<span class="qtd">✓ ${n} no pedido</span>` : ''}</div></div>${i.foto ? `<img src="${i.foto}" alt="" loading="lazy">` : '<span class="ph" aria-hidden="true"></span>'}</button>`
}
function pintar() {
  const f = FILTROS.find(x => x[0] === filtro)[2], q = sem(busca)
  let html = ''
  if (filtro === 'tudo' && !q) {
    const d = itens.filter(i => i.mais && i.foto)
    if (d.length) html += `<section class="cat" id="cat-destaques"><h2>Os mais pedidos</h2><div class="destaques">${d.map(i => `<button class="dest" data-id="${i.id}"><img src="${i.foto}" alt=""><div><b>${esc(i.nome)}</b><span>${R(i.preco)}</span></div></button>`).join('')}</div></section>`
  }
  for (const c of D.categorias) {
    const l = c.itens.map(i => porId[i.id]).filter(i => f(i) && (!q || sem(i.nome + ' ' + i.desc).includes(q)))
    if (l.length) html += `<section class="cat" id="cat-${c.id}"><h2>${esc(c.nome)} <small>${l.length} ${l.length > 1 ? 'opções' : 'opção'}</small></h2><div class="lista">${l.map(cartao).join('')}</div></section>`
  }
  $('#menu').innerHTML = html || `<div class="vazio">Nada com "${esc(busca)}" no cardápio.<br>Tenta outro nome ou ingrediente.</div>`
  $('#abas').innerHTML = [...$('#menu').querySelectorAll('section.cat')].map(s => `<button data-a="${s.id}">${esc(s.querySelector('h2').firstChild.textContent.trim())}</button>`).join('')
  observar()
}
$('#abas').onclick = e => { const b = e.target.closest('button'); if (!b) return; const alvo = document.getElementById(b.dataset.a); window.scrollTo({ top: alvo.getBoundingClientRect().top + scrollY - $('.barra').offsetHeight - 6, behavior: 'smooth' }) }
let obs
function observar() {
  if (obs) obs.disconnect()
  // 19/10 ("as passagens de nível dão uma travada"): scrollIntoView da aba brigava com a rolagem da página.
  // Agora só a faixa das abas rola, de leve, e só quando a aba ativa muda.
  let ativa = ''
  obs = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting || en.target.id === ativa) return; ativa = en.target.id
    const nav = $('#abas'), b = $(`#abas [data-a="${ativa}"]`); document.querySelectorAll('#abas button').forEach(x => x.classList.toggle('on', x === b))
    if (b) nav.scrollTo({ left: b.offsetLeft - nav.clientWidth / 2 + b.clientWidth / 2, behavior: 'smooth' }) }), { rootMargin: '-45% 0px -50% 0px' })
  document.querySelectorAll('section.cat').forEach(s => obs.observe(s))
}
$('#menu').onclick = e => { const b = e.target.closest('[data-id]'); if (b) abrirItem(b.dataset.id) }

/* folha do produto: tirar ingrediente, adicionais, observação, quantidade */
let atual = null
const abrir = f => { $('#veu').classList.add('on'); f.classList.add('on'); document.body.classList.add('trava') }

function abrirItem(id, edita) {
  const i = porId[id], g = i.adicionais[0] && D.grupos[i.adicionais[0].grupo]
  atual = edita ? { ...edita, ad: { ...edita.ad }, tira: [...edita.tira] } : { id, qtd: 1, ad: {}, tira: [], obs: '', chave: Math.random().toString(36).slice(2) }
  const ingr = ingredientes(i)
  $('#f-item').innerHTML = `<button class="fecha" aria-label="Fechar">×</button><div class="rola">
    ${i.foto ? `<img class="foto-grande" src="${i.foto}" alt="">` : '<div style="height:20px"></div>'}
    <h2>${esc(i.nome)}</h2><div class="base">${R(i.preco)}</div>
    ${ingr.length ? `<div class="bloco"><h4>Vem com</h4><div class="ingr" id="ingr">${ingr.map(s => `<button data-s="${esc(s)}" class="${atual.tira.includes(s) ? 'fora' : ''}">${esc(s)}</button>`).join('')}</div><div class="dica">Toque pra tirar o que você não quer.</div></div>` : (i.desc ? `<p style="color:#a8a297;margin-top:10px">${esc(i.desc)}</p>` : '')}
    ${g ? `<div class="bloco"><h4>Turbinar · até ${i.adicionais[0].max}</h4><div id="ads">${g.opcoes.map((o, k) => `<div class="ad"><div class="nome">${esc(o.nome)}<small>+ ${R(o.preco)}</small></div><div class="mm"><button data-k="${k}" data-d="-1">−</button><b id="ad-${k}">${atual.ad[k] || 0}</b><button data-k="${k}" data-d="1">+</button></div></div>`).join('')}</div></div>` : ''}
    <div class="bloco"><h4>Observação</h4><textarea id="obs" placeholder="ex.: bem passado, sem sal, cortar ao meio">${esc(atual.obs)}</textarea></div>
  </div><div class="acao"><div class="mm"><button id="menos">−</button><b id="q-n">${atual.qtd}</b><button id="mais">+</button></div><button class="btn" id="add"></button></div>`
  const total = () => { let t = i.preco; if (g) for (const k in atual.ad) t += g.opcoes[k].preco * atual.ad[k]; return t * atual.qtd }
  const nAd = () => Object.values(atual.ad).reduce((a, b) => a + b, 0)
  const pint = () => { $('#add').textContent = (edita ? 'Salvar · ' : 'Adicionar · ') + R(total()); $('#q-n').textContent = atual.qtd; $('#menos').disabled = atual.qtd <= 1
    if (g) g.opcoes.forEach((o, k) => { $('#ad-' + k).textContent = atual.ad[k] || 0; $(`#ads [data-k="${k}"][data-d="-1"]`).disabled = !atual.ad[k]; $(`#ads [data-k="${k}"][data-d="1"]`).disabled = nAd() >= i.adicionais[0].max }) }
  $('#f-item .fecha').onclick = fechar
  $('#menos').onclick = () => { atual.qtd = Math.max(1, atual.qtd - 1); pint() }
  $('#mais').onclick = () => { atual.qtd++; pint() }
  if (g) $('#ads').onclick = e => { const b = e.target.closest('button'); if (!b) return; const k = b.dataset.k; atual.ad[k] = Math.max(0, (atual.ad[k] || 0) + Number(b.dataset.d)); if (!atual.ad[k]) delete atual.ad[k]; pint() }
  if (ingr.length) $('#ingr').onclick = e => { const b = e.target.closest('button'); if (!b) return; const s = b.dataset.s; atual.tira = atual.tira.includes(s) ? atual.tira.filter(x => x !== s) : [...atual.tira, s]; b.classList.toggle('fora') }
  $('#obs').oninput = e => atual.obs = e.target.value
  $('#add').onclick = () => { const k = sacola.findIndex(x => x.chave === atual.chave); if (k >= 0) sacola[k] = atual; else sacola.push(atual); guardar(); fechar(); pintar(); if (edita) abrirSacola() }
  pint(); abrir($('#f-item')); $('#f-item .rola').scrollTop = 0
}

/* preço de cada linha: sempre recalculado do cardápio */
function linha(x) {
  const i = porId[x.id], g = i.adicionais[0] && D.grupos[i.adicionais[0].grupo]
  let u = i.preco; const ads = []
  if (g) for (const k in x.ad) { u += g.opcoes[k].preco * x.ad[k]; ads.push((x.ad[k] > 1 ? x.ad[k] + 'x ' : '') + g.opcoes[k].nome) }
  return { i, unit: u, total: u * x.qtd, ads, tira: x.tira }
}
// − 1 + em cada linha; no 1, o − vira lixeira e tira o item (19/10: "não dá pra deletar se eu pegar errado?")
const LIXO = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
const passoQt = x => `<span class="qt"><button data-m="${x.chave}" aria-label="${x.qtd > 1 ? 'Diminuir' : 'Tirar do pedido'}" class="${x.qtd > 1 ? '' : 'lixo'}">${x.qtd > 1 ? '−' : LIXO}</button><b>${x.qtd}</b><button data-p="${x.chave}" aria-label="Aumentar">+</button></span>`
function mexerQt(b) {
  const k = b.dataset.m || b.dataset.p, x = sacola.find(y => y.chave === k); if (!x) return false
  if (b.dataset.p) x.qtd++; else if (x.qtd > 1) x.qtd--; else sacola = sacola.filter(y => y.chave !== k)
  guardar(); pintar(); return true
}
function pintarSacola() {
  const n = sacola.reduce((a, x) => a + x.qtd, 0), t = sacola.reduce((a, x) => a + linha(x).total, 0)
  $('#sacola').classList.toggle('on', n > 0); $('#sac-n').textContent = n; $('#sac-t').textContent = R(t); $('#sac-q').textContent = n === 1 ? '1 item' : n + ' itens'
  const ult = [...sacola].reverse().map(x => porId[x.id]).find(i => i && i.foto); if (ult) $('#sac-img').src = ult.foto
  pintarLado(n, t)
}
// coluna fixa do pedido no computador: sempre à vista, edita e tira item ali mesmo
function pintarLado(n, t) {
  const L = $('#lado'); if (!L) return
  L.innerHTML = `<header><h3>Seu pedido</h3><span>${n ? (n === 1 ? '1 item' : n + ' itens') : ''}</span></header>` +
    (n ? `<div class="itens">${sacola.map(x => { const l = linha(x); const extra = [l.ads.length ? '+ ' + l.ads.join(', ') : '', l.tira.length ? 'sem ' + l.tira.join(', ') : '', x.obs].filter(Boolean).map(esc).join(' · ')
      return `<div class="li">${l.i.foto ? `<img src="${l.i.foto}" alt="">` : '<span class="ph2"></span>'}<div><b>${esc(l.i.nome)}</b>${extra ? `<small>${extra}</small>` : ''}<div class="acoes">${passoQt(x)}<button class="ed" data-e="${x.chave}">Editar</button></div></div><div class="v">${R(l.total)}</div></div>` }).join('')}</div>`
       : `<div class="vazio2"><p><span style="display:block;font-size:40px;margin-bottom:8px">🍔</span>Seu pedido está vazio.<br>Escolha um lanche ao lado.</p></div>`) +
    `<footer><div class="t"><span>Total dos itens</span><span>${R(t)}</span></div><small>Entrega a partir de ${R(TAXA_MIN)} · ${D.loja.tempo_entrega}. Retirada sem taxa.</small><button class="btn" id="lado-ir" ${n ? '' : 'disabled'}>Fechar pedido</button></footer>`
  L.onclick = e => { const b = e.target.closest('button'); if (!b) return
    if (b.id === 'lado-ir') return abrirSacola()
    if (b.dataset.m || b.dataset.p) { mexerQt(b); return }
    if (b.dataset.e) { const x = sacola.find(y => y.chave === b.dataset.e); abrirItem(x.id, x) } }
}

function sugestoes() {

const TAXAS = D.loja.taxas_bairro || {}, TAXA_MIN = Math.min(...Object.values(TAXAS))
const taxa = () => { if (tipo !== 'entrega') return 0; const b = $('#bairro') && $('#bairro').value; return b in TAXAS ? TAXAS[b] : null }
// ===== MODO GARÇOM (?garcom no endereço): entra com a senha, escolhe a mesa, o pedido vai pro CRM e sai a comanda MESA X. Sem WhatsApp.
const GARCOM = new URLSearchParams(location.search).has('garcom')
let gc = null; try { gc = JSON.parse(localStorage.getItem('lucius_garcom') || 'null') } catch (e) {}
let mesa = 0
function telaGarcom() {
  document.querySelector('.gc-barra')?.remove()
  if (!gc) {
    $('#f-sacola').innerHTML = `<div class="gc-login"><h2>Entrar como garçom</h2><p class="dica">Digite a sua senha de 4 números.</p><input id="gc-pin" inputmode="numeric" maxlength="6" autocomplete="off" type="password"><div class="erro" id="gc-erro"></div><button class="btn" id="gc-entrar" style="margin-top:12px;width:100%;max-width:240px">Entrar</button></div>`
    abrir($('#f-sacola')); setTimeout(() => $('#gc-pin').focus(), 300)
    $('#gc-entrar').onclick = async () => { const pin = $('#gc-pin').value.trim(); $('#gc-erro').textContent = ''
      const r = await registrar({ chave: 'kmp_lucius_lanches', acao: 'entrar', pin })
      if (!r || !r.ok) { $('#gc-erro').textContent = 'Senha errada.'; return }
      gc = { nome: r.garcom, pin, mesas: r.mesas }; try { localStorage.setItem('lucius_garcom', JSON.stringify(gc)) } catch (e) {}
      fechar(); telaGarcom() }
    $('#gc-pin').onkeydown = e => { if (e.key === 'Enter') $('#gc-entrar').click() }
    return
  }
  const b = document.createElement('div'); b.className = 'gc-barra'; b.innerHTML = `Garçom: <b>${esc(gc.nome)}</b><button>Sair</button>`
  b.querySelector('button').onclick = () => { gc = null; try { localStorage.removeItem('lucius_garcom') } catch (e) {} telaGarcom() }
  document.body.appendChild(b)
}
function abrirSacolaGarcom() {
  const ts = sacola.reduce((a, x) => a + linha(x).total, 0)
  $('#f-sacola').innerHTML = `<button class="fecha" aria-label="Fechar">×</button><div class="rola"><h2 style="margin-top:22px">Pedido da mesa</h2>
    ${sacola.map(x => { const l = linha(x); return `<div class="linha-c"><b>${esc(l.i.nome)}</b><span>${R(l.total)}</span>${l.ads.length || l.tira.length || x.obs ? `<small>${[l.ads.length ? '+ ' + l.ads.join(', ') : '', l.tira.length ? 'sem ' + l.tira.join(', ') : '', x.obs].filter(Boolean).map(esc).join(' · ')}</small>` : ''}<div class="acoes">${passoQt(x)}<button class="ed" data-e="${x.chave}">Editar</button></div></div>` }).join('')}
    <div class="bloco"><h4>Mesa</h4><div class="mesas" id="mesas">${Array.from({ length: gc.mesas }, (_, k) => `<button data-mesa="${k + 1}" class="${mesa === k + 1 ? 'on' : ''}">${k + 1}</button>`).join('')}</div></div>
    <div class="bloco"><h4>Observação pra cozinha</h4><div class="campo"><input id="gc-obs" placeholder="ex.: sai junto com a mesa 4"></div></div>
    <div class="total"><span>Total</span><span>${R(ts)}</span></div><div class="erro" id="erro"></div>
  </div><div class="acao"><button class="btn" id="enviar">Enviar pra cozinha</button></div>`
  $('#f-sacola .fecha').onclick = fechar
  $('#f-sacola .rola').onclick = e => { const b = e.target.closest('button'); if (!b) return
    if (b.dataset.mesa) { mesa = Number(b.dataset.mesa); document.querySelectorAll('#mesas button').forEach(x => x.classList.toggle('on', x === b)); return }
    if (b.closest('.qt')) { mexerQt(b); sacola.length ? abrirSacolaGarcom() : fechar(); return }
    if (b.dataset.e) { const x = sacola.find(y => y.chave === b.dataset.e); fechar(); setTimeout(() => abrirItem(x.id, x), 260) } }
  $('#enviar').onclick = async () => {
    if (!mesa) { $('#erro').textContent = 'Escolhe a mesa.'; $('#mesas').scrollIntoView({ behavior: 'smooth', block: 'center' }); return }
    const bt = $('#enviar'); bt.disabled = true; bt.textContent = 'Enviando…'
    const r = await registrar({ chave: 'kmp_lucius_lanches', pin: gc.pin, mesa, obs: $('#gc-obs').value.trim(), itens: sacola.map(x => ({ id: x.id, qtd: x.qtd, ad: x.ad, tira: x.tira, obs: x.obs })) })
    bt.disabled = false; bt.textContent = 'Enviar pra cozinha'
    if (!r || !r.ok) { $('#erro').textContent = 'Não foi. Confere a internet e tenta de novo.'; return }
    const m = mesa; sacola = []; mesa = 0; guardar(); pintar(); fechar()
    const ok = document.createElement('div'); ok.className = 'gc-ok'; ok.textContent = `Mesa ${m} · pedido nº ${r.numero} foi pra cozinha`; document.body.appendChild(ok); setTimeout(() => ok.remove(), 3500)
  }
  if (!$('#f-sacola').classList.contains('on')) abrir($('#f-sacola'))
}

function abrirSacola() {
  if (GARCOM) return abrirSacolaGarcom()
  const ts = sacola.reduce((a, x) => a + linha(x).total, 0), sg = sugestoes()
  $('#f-sacola').innerHTML = `<button class="fecha" aria-label="Fechar">×</button><div class="rola"><h2 style="margin-top:22px">Seu pedido</h2>
    ${sacola.map(x => { const l = linha(x); return `<div class="linha-c"><b>${esc(l.i.nome)}</b><span>${R(l.total)}</span>${l.ads.length || l.tira.length || x.obs ? `<small>${[l.ads.length ? '+ ' + l.ads.join(', ') : '', l.tira.length ? 'sem ' + l.tira.join(', ') : '', x.obs].filter(Boolean).map(esc).join(' · ')}</small>` : ''}<div class="acoes">${passoQt(x)}<button class="ed" data-e="${x.chave}">Editar</button></div></div>` }).join('')}
    ${sg.length ? `<div class="bloco"><h4>Vai junto?</h4><div class="sug">${sg.map(i => `<button data-s="${i.id}">${i.foto ? `<img src="${i.foto}" alt="">` : ''}${esc(i.nome)} <span>${R(i.preco)}</span></button>`).join('')}</div></div>` : ''}
    <div class="bloco"><h4>Como você quer receber?</h4><div class="seg" id="tipo"><button data-t="entrega">Entrega<small>${D.loja.tempo_entrega} · a partir de ${R(TAXA_MIN)}</small></button><button data-t="retirada">Retirar no balcão<small>${D.loja.tempo_retirada} · sem taxa</small></button></div>
      <div id="end-box"><div class="campo"><label>Rua e número</label><input id="rua" autocomplete="street-address"></div><div class="campo"><label>Bairro</label><select id="bairro"><option value="">Escolhe o bairro</option>${Object.keys(TAXAS).map(b => `<option>${esc(b)}</option>`).join('')}<option value="Outro">Outro bairro</option></select></div><div class="campo"><label>Complemento ou referência</label><input id="ref"></div></div></div>
    <div class="bloco"><h4>Pagamento</h4><div class="seg" id="pag">${D.loja.pagamentos.map(p => `<button data-p="${p}">${p}</button>`).join('')}</div><div class="dica" id="pag-quando"></div><div class="campo" id="troco-box" style="display:none"><label>Troco pra quanto?</label><input id="troco" inputmode="decimal" placeholder="ex.: 50"></div></div>
    <div class="bloco"><h4>Seus dados</h4><div class="campo"><label>Nome</label><input id="nome" autocomplete="name"></div><div class="campo"><label>WhatsApp</label><input id="tel" inputmode="tel" autocomplete="tel" placeholder="(37) 9...."></div></div>
    <div class="contas" id="contas"></div><div class="total"><span>Total</span><span id="tot"></span></div><div class="erro" id="erro"></div>
  </div><div class="acao"><button class="btn" id="enviar">Enviar pedido pelo WhatsApp</button></div>`
  const ped = (() => { try { return JSON.parse(localStorage.getItem('lucius_dados') || '{}') } catch (e) { return {} } })()
  ;['nome', 'tel', 'rua', 'bairro', 'ref'].forEach(k => { if (ped[k]) $('#' + k).value = ped[k] })
  const seg = () => { document.querySelectorAll('#tipo button').forEach(b => b.classList.toggle('on', b.dataset.t === tipo)); document.querySelectorAll('#pag button').forEach(b => b.classList.toggle('on', b.dataset.p === pag)); $('#end-box').style.display = tipo === 'entrega' ? '' : 'none'; $('#pag-quando').textContent = tipo === 'entrega' ? 'Você paga quando o pedido chegar.' : 'Você paga quando vier buscar.'; const tx = taxa(); $('#contas').innerHTML = `<div><span>Itens</span><span>${R(ts)}</span></div>` + (tipo === 'entrega' ? `<div><span>Entrega</span><span>${tx == null ? ($('#bairro').value ? 'a loja confirma' : 'escolhe o bairro') : R(tx)}</span></div>` : ''); $('#tot').textContent = R(ts + (tx || 0)) + (tipo === 'entrega' && tx == null ? ' + entrega' : ''); $('#troco-box').style.display = pag === 'Dinheiro' ? '' : 'none' }
  $('#bairro').onchange = seg
  $('#tipo').onclick = e => { const b = e.target.closest('button'); if (b) { tipo = b.dataset.t; seg() } }
  $('#pag').onclick = e => { const b = e.target.closest('button'); if (b) { pag = b.dataset.p; seg() } }
  $('#f-sacola .fecha').onclick = fechar
  $('#f-sacola .rola').onclick = e => { const b = e.target.closest('button'); if (!b) return
    if (b.closest('.qt')) { mexerQt(b); sacola.length ? abrirSacola() : fechar(); return }
    if (b.dataset.e) { const x = sacola.find(y => y.chave === b.dataset.e); fechar(); setTimeout(() => abrirItem(x.id, x), 260) }
    if (b.dataset.s) { sacola.push({ id: b.dataset.s, qtd: 1, ad: {}, tira: [], obs: '', chave: Math.random().toString(36).slice(2) }); guardar(); pintar(); abrirSacola() } }
  $('#enviar').onclick = enviar
  seg(); if (!$('#f-sacola').classList.contains('on')) abrir($('#f-sacola'))
}
// o pedido entra no CRM da loja (função pedido: o preço é conferido lá pelo cardápio) e depois abre o WhatsApp com o número.
// Se a internet ou o servidor falhar, o pedido segue pelo WhatsApp do mesmo jeito.
const PEDIDO_URL = 'https://fmbxnfebumfhrviumkbu.supabase.co/functions/v1/pedido'
async function registrar(dados) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), 6000)
  try { const r = await fetch(PEDIDO_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(dados), signal: c.signal }); const j = await r.json(); return r.ok ? j : null } catch (e) { return null } finally { clearTimeout(t) }
}
// PUSH (0190): ao enviar, pergunta uma vez se pode avisar quando o pedido sair; aceito, o aparelho fica inscrito só naquele pedido
const VAPID = 'BNFA5efd80KpdLxgbmMZiJUrU5gTwzEwoD9HVXDdquK6T15Sl-B3upCFdenTOUTY4H_p3u3SzBuANGcrbnO-qhM'
const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window
const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4), r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)) }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {})
async function inscreverPush(pedidoId) {
  try {
    if (!pushOk() || Notification.permission !== 'granted') return
    const reg = await navigator.serviceWorker.ready
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(VAPID) })
    await registrar({ chave: 'kmp_lucius_lanches', acao: 'push', pedido_id: pedidoId, sub: sub.toJSON() })
  } catch (e) {}
}
async function enviar() {
  const v = k => $('#' + k).value.trim(), tel = v('tel').replace(/\D/g, '')
  const falta = !v('nome') ? 'Coloca seu nome.' : tel.length < 10 ? 'Coloca seu WhatsApp com DDD.' : tipo === 'entrega' && (!v('rua') || !v('bairro')) ? 'Coloca a rua, o número e o bairro.' : ''
  $('#erro').textContent = falta; if (falta) return
  try { localStorage.setItem('lucius_dados', JSON.stringify({ nome: v('nome'), tel: v('tel'), rua: v('rua'), bairro: v('bairro'), ref: v('ref') })) } catch (e) {}
  const ts = sacola.reduce((a, x) => a + linha(x).total, 0)
  const linhas = sacola.map(x => { const l = linha(x); return `• ${x.qtd}x ${l.i.nome} (${R(l.total)})` + (l.ads.length ? `\n   + ${l.ads.join(', ')}` : '') + (l.tira.length ? `\n   sem ${l.tira.join(', ')}` : '') + (x.obs ? `\n   obs: ${x.obs}` : '') })
  const msg = [`*Pedido pelo cardápio* · ${v('nome')}`, '', ...linhas, '', ...(tipo === 'entrega' ? [`Itens: ${R(ts)}`, `Entrega: ${taxa() == null ? 'confirmar comigo' : R(taxa())}`] : []), `*Total: ${R(ts + (taxa() || 0))}${tipo === 'entrega' && taxa() == null ? ' + entrega' : ''}*`, tipo === 'entrega' ? `Entrega: ${v('rua')}, ${v('bairro')}${v('ref') ? ' (' + v('ref') + ')' : ''}` : 'Retirada no balcão', `Pagamento: ${pagTxt()}${pag === 'Dinheiro' && v('troco') ? ', troco pra R$ ' + v('troco') : ''}`].filter(s => s !== '').join('\n')
  try { localStorage.setItem('lucius_ultimo', JSON.stringify(sacola)) } catch (e) {}
  const bt = $('#enviar'); bt.disabled = true; bt.textContent = 'Enviando…'
  const permissao = pushOk() && Notification.permission === 'default' ? Notification.requestPermission().catch(() => 'denied') : null   // no toque, antes de qualquer espera (Safari exige)
  const r = await registrar({ chave: 'kmp_lucius_lanches', nome: v('nome'), telefone: tel, tipo, endereco: tipo === 'entrega' ? `${v('rua')}, ${v('bairro')}${v('ref') ? ' (' + v('ref') + ')' : ''}` : '', bairro: tipo === 'entrega' ? v('bairro') : '', pagamento: pagTxt(), troco: pag === 'Dinheiro' ? v('troco') : '', itens: sacola.map(x => ({ id: x.id, qtd: x.qtd, ad: x.ad, tira: x.tira, obs: x.obs })) })
  if (permissao) await permissao
  if (r && r.id) await inscreverPush(r.id)
  bt.disabled = false; bt.textContent = 'Enviar pedido pelo WhatsApp'
  location.href = `https://wa.me/${D.loja.whatsapp}?text=${encodeURIComponent(r && r.numero ? msg.replace('*Pedido pelo cardápio*', `*Pedido nº ${r.numero}*`) : msg)}`
}

/* pedir de novo: o último pedido deste celular */
;(() => { let u = []; try { u = JSON.parse(localStorage.getItem('lucius_ultimo') || '[]').filter(x => porId[x.id]) } catch (e) {}
  if (!u.length) return
  $('#repetir').style.display = 'block'; $('#repetir-txt').textContent = u.map(x => x.qtd + 'x ' + porId[x.id].nome).join(', ')
  $('#repetir').onclick = () => { sacola = u.map(x => ({ ...x, chave: Math.random().toString(36).slice(2) })); guardar(); pintar(); abrirSacola() } })()

$('#comece').onclick = () => document.querySelector('.barra').scrollIntoView({ behavior: 'smooth' })
// a coluna do pedido no computador começa logo abaixo da foto e gruda no topo ao rolar
const posLado = () => { const L = $('#lado'); if (!L) return; L.style.top = Math.max(24, document.querySelector('.hero').getBoundingClientRect().bottom + 24) + 'px' }
addEventListener('scroll', posLado, { passive: true }); addEventListener('resize', posLado)
pintar(); pintarSacola(); posLado()
if (GARCOM) { telaGarcom(); const rp = $('#repetir'); if (rp) rp.remove() }
</script>
