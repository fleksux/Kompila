<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema Coleve</title>
<meta name="robots" content="noindex">
<script>if (location.pathname.includes('/feed/')) document.write('<base href="' + location.pathname.replace(/feed\/.*$/, '') + '">');</script>
<meta name="theme-color" content="#1A71FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/apple_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coleve">
<link rel="icon" href="../img/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="sistema.css?v=30">
</head>
<body class="carregando">

<header class="barra">
  <a href="./" class="barra__marca"><img src="../img/logo_ev.png" alt="Coleve eletromobilidade" width="900" height="270"></a>
  <span class="barra__tag" id="tag" hidden>Área do cliente</span>
  <nav class="barra__nav" id="nav" aria-label="Sistema" hidden><a href="./" id="nav-inicio">Área interna</a><a href="feed/" id="nav-feed">Feed</a><a href="tarefas/">Tarefas</a><a href="marketing/">Marketing</a><a href="conversas/">Conversas</a><a href="clientes/">Clientes</a></nav>
  <div class="barra__eu">
    <span class="avatar" id="avatar">·</span>
    <div><b id="nome">…</b><small id="papel"></small></div>
    <button class="sair" id="sair" type="button">Sair</button>
  </div>
</header>

<main class="miolo">
  <p class="sec" id="sec">Início</p>
  <h1 class="h1">Olá, <b id="primeiro">…</b></h1>
  <p class="sub" id="sub"></p>

  <section class="numeros" id="numeros" hidden></section>

  <section class="modulos" id="modulos"></section>
  <section class="feed" id="feed" hidden></section>

  <p class="nota">O Sistema Coleve está sendo montado por partes. Os módulos acendem conforme ficam prontos.</p>
</main>

<script type="module">
import { banco, quemSou } from './conexao.js?v=2';

const eu = await quemSou().catch(() => null);
if (!eu?.pessoa?.ativo) { location.replace('../entrar/'); throw 0; }
const p = eu.pessoa;
const equipe = p.tipo === 'equipe';
const areas = { fiscal:'Fiscal', contabil:'Contábil', dp:'Departamento pessoal', bpo:'BPO financeiro', paralegal:'Paralegal', atendimento:'Atendimento', tecnologia:'Tecnologia', marketing:'Marketing' };

document.getElementById('nome').textContent = p.nome;
document.getElementById('primeiro').textContent = p.nome.split(' ')[0] + '.';
document.getElementById('avatar').textContent = p.nome.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
document.getElementById('papel').textContent = equipe ? (p.papel === 'admin' ? 'Equipe · acesso total' : 'Equipe · ' + (areas[p.area] || p.papel)) : 'Cliente';
// a etiqueta só aparece pro cliente; na equipe ela empurrava o menu e ele mudava de lugar entre as páginas
document.getElementById('tag').textContent = 'Área do cliente';
document.getElementById('tag').hidden = equipe;
document.getElementById('sec').textContent = equipe ? 'Área interna · equipe Coleve' : 'Área do cliente';

const num = (n, t) => `<div class="num"><strong>${n}</strong><span>${t}</span></div>`;
const mod = (t, d, ico, href) => href
  ? `<a class="mod mod--ativo" href="${href}"><span class="ico">${ico}</span><h3>${t}</h3><p>${d}</p><em>Abrir</em></a>`
  : `<article class="mod"><span class="ico">${ico}</span><h3>${t}</h3><p>${d}</p><em>Em montagem</em></article>`;
const I = {
  raio:'<svg viewBox="0 0 24 24"><path d="M13 3 5 14h6l-1 7 8-11h-6l1-7Z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>',
  tarefa:'<svg viewBox="0 0 24 24"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h10"/></svg>',
  empresa:'<svg viewBox="0 0 24 24"><path d="M4 21V5l8-3v19M12 9h8v12M7 8h2M7 12h2M7 16h2M15 13h2M15 17h2"/></svg>',
  doc:'<svg viewBox="0 0 24 24"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm7 1.5V9h5.5M8 13h8M8 17h6"/></svg>',
  pedido:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5Zm4 5h8M8 13h5"/></svg>',
  fone:'<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><path d="M4 6h16v15H4zM4 10h16M8 3v4M16 3v4"/></svg>'
};

// Início = cards (o mapa do sistema); Feed = o que está acontecendo
const modoFeed = location.pathname.includes('/feed/');
document.getElementById(modoFeed ? 'nav-feed' : 'nav-inicio')?.setAttribute('aria-current', 'page');
if (equipe && modoFeed) {
  // ===== FEED: o dia (o que está com você + atividade do time) =====
  document.getElementById('nav').hidden = false;
  document.querySelector('main > .nota')?.remove();
  document.getElementById('modulos').remove();
  document.getElementById('sec').textContent = 'Feed';
  document.getElementById('sub').textContent = 'O que está com você hoje.';
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dBR = d => d ? d.split('-').reverse().slice(0, 2).join('/') : '';
  const hoje = new Date().toISOString().slice(0, 10);
  const rel = new Intl.RelativeTimeFormat('pt-BR', { numeric: 'auto' });
  const quando = d => { const m = Math.round((new Date(d) - Date.now()) / 60000); return Math.abs(m) < 60 ? rel.format(m, 'minute') : Math.abs(m) < 1440 ? rel.format(Math.round(m / 60), 'hour') : rel.format(Math.round(m / 1440), 'day'); };
  const FMT = { feed: 'Post', carrossel: 'Carrossel', story: 'Story', reels: 'Reels', outro: 'Material' };
  const [{ data: ds }, { data: ts }, { data: cs }] = await Promise.all([
    banco.from('v_demanda').select('id,titulo,status,data_prevista,formato,responsavel_id,pedido_por,pedido_por_nome,responsavel_nome').neq('status', 'cancelado'),
    banco.from('v_tarefa').select('id,titulo,status,prazo,atrasada,area,empresa_nome').eq('responsavel_id', p.id).neq('status', 'cancelado').neq('status', 'enviado').order('prazo', { nullsFirst: false }).limit(40),
    banco.from('canal').select('id').in('slug', ['marketing', 'tecnologia', 'geral'])
  ]);
  const { data: ms } = await banco.from('mensagem').select('texto,criado_em,autor:pessoa(nome)').in('canal_id', (cs || []).map(c => c.id)).not('texto', 'is', null).order('criado_em', { ascending: false }).limit(40);
  const D = ds || [];
  const atrasoD = x => x.data_prevista && x.data_prevista < hoje && !['aprovado', 'publicado'].includes(x.status);
  const paraAprovar = D.filter(x => x.pedido_por === p.id && x.status === 'aprovacao');
  const minhaFila = D.filter(x => x.responsavel_id === p.id && ['ajuste', 'produzindo', 'pedido'].includes(x.status))
    .sort((a, b) => (b.status === 'ajuste') - (a.status === 'ajuste') || atrasoD(b) - atrasoD(a) || (b.status === 'produzindo') - (a.status === 'produzindo') || (a.data_prevista || '9').localeCompare(b.data_prevista || '9'));
  const tarefas = (ts || []).filter(x => x.status !== 'pronto');
  const etq = { ajuste: 'ajuste', produzindo: 'fazendo', pedido: 'novo', aprovacao: 'aprovar' };
  const item = (ico, titulo, meta, href, tag, cls = '') => `<a class="fi ${cls}" href="${href}"><span class="ico">${ico}</span><span class="fi__t"><b>${esc(titulo)}</b><small>${meta}</small></span>${tag ? `<em>${tag}</em>` : ''}</a>`;
  const bloco = (titulo, n, itens, mais) => itens ? `<div class="fb"><p class="sec">${titulo}${n != null ? ` · ${n}` : ''}</p><div class="fl">${itens}</div>${mais || ''}</div>` : '';
  const metaD = x => [FMT[x.formato] || 'Peça', x.data_prevista ? 'para ' + dBR(x.data_prevista) : null, 'pedido por ' + esc((x.pedido_por_nome || '').split(' ')[0])].filter(Boolean).join(' · ');
  const nomeSt = { a_fazer: 'a fazer', fazendo: 'fazendo', conferencia: 'em teste' };

  // atividade: recado do banco vira frase (quem + ação + objeto)
  const evento = (texto, autor) => {
    const q = `<b>${esc((autor || 'Alguém').split(' ')[0])}</b>`; let m;
    if ((m = texto.match(/^\S+ Nova demanda: (.+?)(?: · para (\d\d\/\d\d))?$/))) return [I.doc, `${q} pediu <b>${esc(m[1])}</b>`];
    if ((m = texto.match(/^\S+ (.+?) · versão (\d+) esperando aprovação$/))) return [I.pedido, `${q} mandou <b>${esc(m[1])}</b> para aprovação`];
    if ((m = texto.match(/^\S+ Aprovado: (.+?) \(versão \d+\)$/))) return [I.check, `${q} aprovou <b>${esc(m[1])}</b>`];
    if ((m = texto.match(/^\S+ Ajuste pedido em (.+?) \(versão \d+\)/))) return [I.tarefa, `${q} pediu ajuste em <b>${esc(m[1])}</b>`];
    if ((m = texto.match(/^\S+ (.+?) → (.+)$/))) return [I.raio, `${q} moveu <b>${esc(m[1])}</b> para ${esc(m[2])}`];
    return null;
  };
  const ativ = (ms || []).map(m => ({ m, e: evento(m.texto, m.autor?.nome) })).filter(x => x.e).slice(0, 6);

  const feed = document.getElementById('feed');
  feed.hidden = false;
  feed.innerHTML =
    bloco('Para você aprovar', paraAprovar.length, paraAprovar.map(x => item(I.check, x.titulo, metaD(x).replace(/pedido por \S+/, 'feito por ' + esc((x.responsavel_nome || '').split(' ')[0])), 'marketing/#' + x.id, 'aprovar', 'fi--destaque')).join('')) +
    bloco('Fazer agora', minhaFila.length, minhaFila.slice(0, 6).map(x => item(I.doc, x.titulo, metaD(x), 'marketing/#' + x.id, x.status === 'ajuste' ? 'ajuste' : atrasoD(x) ? 'atrasado' : etq[x.status], x.status === 'ajuste' || atrasoD(x) ? 'fi--alerta' : '')).join('') || '<p class="fv">Nada na sua fila de marketing.</p>',
      minhaFila.length > 6 ? `<a class="fmais" href="marketing/">Ver a fila completa (${minhaFila.length})</a>` : '') +
    bloco('Tarefas', tarefas.length, tarefas.slice(0, 5).map(x => item(x.area === 'tecnologia' ? I.raio : I.tarefa, x.titulo, [esc(x.empresa_nome), x.prazo ? 'até ' + dBR(x.prazo) : null].filter(Boolean).join(' · '), 'tarefas/', x.atrasada ? 'atrasada' : nomeSt[x.status], x.atrasada ? 'fi--alerta' : '')).join(''),
      tarefas.length > 5 ? `<a class="fmais" href="tarefas/">Ver todas (${tarefas.length})</a>` : '') +
    bloco('Atividade do time', null, ativ.map(({ m, e }) => `<div class="fa"><span class="ico ico--leve">${e[0]}</span><p>${e[1]}</p><time datetime="${m.criado_em}">${quando(m.criado_em)}</time></div>`).join('') || '<p class="fv">Quando alguém pedir, enviar ou aprovar, aparece aqui.</p>');
} else 
if (equipe && ['marketing', 'tecnologia'].includes(p.area)) {
  // mesma linguagem do início: 3 números + 6 cards iguais (grade de 3)
  document.getElementById('nav').hidden = false;
  document.getElementById('sec').textContent = 'Meu painel · marketing e sistema';
  document.getElementById('sub').textContent = 'O que está com você hoje.';
  document.querySelector('main > .nota')?.remove();
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const [{ data: ds }, { data: ts }] = await Promise.all([
    banco.from('v_demanda').select('id,titulo,status,data_prevista').eq('responsavel_id', p.id).neq('status', 'cancelado'),
    banco.from('v_tarefa').select('id,titulo,status').eq('responsavel_id', p.id).is('empresa_id', null).neq('status', 'cancelado')
  ]);
  const D = ds || [], T = ts || [];
  const n = f => D.filter(f).length;
  const fila = D.filter(x => ['ajuste', 'pedido', 'produzindo'].includes(x.status))
    .sort((a, b) => (b.status === 'ajuste') - (a.status === 'ajuste') || (b.status === 'produzindo') - (a.status === 'produzindo') || (a.data_prevista || '9').localeCompare(b.data_prevista || '9'));
  const esperando = n(x => x.status === 'aprovacao'), aprovados = n(x => x.status === 'aprovado'), ajustes = n(x => x.status === 'ajuste');
  const noAr = T.filter(x => x.status === 'enviado').length, pctS = T.length ? Math.round(noAr / T.length * 100) : 0;
  const abertasT = T.filter(x => x.status !== 'enviado').length + fila.length;
  const prox = fila[0];

  const nb = document.getElementById('numeros');
  nb.innerHTML = num(fila.length, 'pedidos na fila') + num(esperando, 'esperando o Manu') + num(pctS + '%', 'do Sistema Coleve no ar');
  nb.hidden = false;

  const card = (t, d, ico, href, etiqueta, extra = '') =>
    `<a class="mod mod--ativo" href="${href}"><span class="ico">${ico}</span><h3>${t}</h3><p>${d}</p>${extra}<em>${etiqueta}</em></a>`;
  document.getElementById('modulos').innerHTML =
    card('Marketing', 'Peça, envie a arte e aprove. Tudo com a pasta no Drive.', I.doc, 'marketing/', `${fila.length} na fila`) +
    card('Tarefas', 'Seus cards de marketing e do sistema, num quadro só.', I.tarefa, 'tarefas/', `${abertasT} abertas`) +
    card('Conversas', 'Canais por área e conversa direta com o time.', I.pedido, 'conversas/', 'Abrir') +
    (prox ? card('Fazer agora', esc(prox.titulo), I.cal, 'marketing/#' + prox.id, prox.status === 'ajuste' ? 'ajuste' : 'próximo') : card('Fazer agora', 'Fila zerada. Nada esperando por você.', I.cal, 'marketing/', 'em dia')) +
    card('Aprovações', `${esperando} esperando o Manu · ${aprovados} aprovad${aprovados === 1 ? 'a' : 'as'} para publicar${ajustes ? ` · ${ajustes} ajuste${ajustes > 1 ? 's' : ''}` : ''}.`, I.check, 'marketing/', String(esperando)) +
    card('Sistema Coleve', `${noAr} de ${T.length} etapas no ar.`, I.raio, 'tarefas/', pctS + '%', `<span class="mod__barra" aria-hidden="true"><i style="width:${pctS}%"></i></span>`);
} else if (equipe) {
  document.getElementById('nav').hidden = false;
  document.getElementById('sub').textContent = 'Tarefas, clientes, documentos e ligações da Coleve em um lugar só.';
  const [emp, tar, obr] = await Promise.all([
    banco.from('empresa').select('id', { count: 'exact', head: true }),
    banco.from('tarefa').select('id', { count: 'exact', head: true }).neq('status', 'enviado'),
    banco.from('obrigacao_tipo').select('codigo', { count: 'exact', head: true })
  ]);
  const nb = document.getElementById('numeros');
  nb.innerHTML = num(emp.count ?? 0, 'empresas no sistema') + num(tar.count ?? 0, 'tarefas abertas') + num(obr.count ?? 0, 'obrigações no calendário');
  nb.hidden = false;
  document.getElementById('modulos').innerHTML =
    mod('Tarefas', 'Quadro por área, com responsável, prazo e conferência.', I.tarefa, 'tarefas/') +
    mod('Calendário de obrigações', 'Guias e declarações do mês geradas pelo regime de cada empresa. Roda sozinho todo dia 1º.', I.cal, 'tarefas/') +
    mod('Clientes', 'Ficha da empresa, regime, responsáveis, obrigações e documentos enviados.', I.empresa, 'clientes/') +
    mod('Documentos', 'Guias, apurações e o que o cliente mandou, com protocolo de envio.', I.doc) +
    mod('Pedidos', 'Segunda via, certidão e alteração pedidas pelo cliente.', I.pedido) +
    mod('Ligações', 'Discar para o cliente e registrar cada chamada na ficha.', I.fone);
  document.getElementById('modulos').insertAdjacentHTML('afterbegin', mod('Marketing', 'Peça um post com referência, receba a versão na cara do Instagram e aprove.', I.doc, 'marketing/'));
  document.getElementById('modulos').insertAdjacentHTML('afterbegin', mod('Conversas', 'Canais por área e conversa direta, com troca de arquivos. O cliente nunca vê.', I.pedido, 'conversas/'));
} else {
  const { data: emps } = await banco.from('empresa').select('id,nome_fantasia,razao_social,segmento');
  const nomes = (emps || []).map(e => e.nome_fantasia || e.razao_social).join(', ');
  document.getElementById('sub').textContent = nomes ? 'Empresa: ' + nomes : 'Sua empresa ainda está sendo cadastrada pela Coleve.';
  document.getElementById('modulos').innerHTML =
    mod('Pedidos', 'Peça uma certidão, segunda via ou alteração.', I.pedido) +
    mod('Andamento', 'Veja quem está cuidando de cada entrega e o prazo.', I.tarefa);
  // documentos que a Coleve enviou: o mais novo em cima, "novo" até o cliente abrir
  const { baixar, TIPOS, reais, enviarPendencia, mesNome } = await import('./documentos.js?v=3');
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dBR = d => d ? d.split('-').reverse().join('/') : '';
  const feed = document.getElementById('feed');
  document.getElementById('modulos').before(feed);
  const desenhaDocs = async () => {
    const { data: docs } = await banco.from('documento').select('id,nome,tipo,valor,vencimento,competencia,criado_em,protocolo(lido_em)').eq('vindo_do_cliente', false).order('criado_em', { ascending: false }).limit(60);
    const D = docs || [];
    const novos = D.filter(d => !d.protocolo?.[0]?.lido_em).length;
    feed.hidden = false;
    feed.innerHTML = `<div class="fb"><p class="sec">Seus documentos${novos ? ` · ${novos} novo${novos > 1 ? 's' : ''}` : ''}</p><div class="fl">${D.map(d => {
      const novo = !d.protocolo?.[0]?.lido_em;
      const meta = [TIPOS[d.tipo], d.competencia ? 'referente a ' + dBR(d.competencia).slice(3) : null, d.valor != null ? reais(d.valor) : null, d.vencimento ? 'vence ' + dBR(d.vencimento) : null].filter(Boolean).join(' · ');
      return `<button type="button" class="fi${novo ? ' fi--destaque' : ''}" data-id="${d.id}"><span class="ico">${I.doc}</span><span class="fi__t"><b>${esc(d.nome)}</b><small>${meta}</small></span><em>${novo ? 'novo' : 'baixar'}</em></button>`;
    }).join('') || '<p class="fv">Quando a Coleve enviar uma guia ou documento, ele aparece aqui.</p>'}</div></div>`;
    feed.onclick = async e => {
      const b = e.target.closest('.fi'); if (!b) return;
      const em = b.querySelector('em'); em.textContent = 'baixando';
      try { await baixar(D.find(d => d.id === b.dataset.id)); em.textContent = 'baixar'; b.classList.remove('fi--destaque'); }
      catch { em.textContent = 'tente de novo'; }
    };
  };
  // o que mandar este mês: checklist do segmento, cada item com o botão de enviar (vai pro Drive da empresa)
  const lista = document.createElement('section'); lista.className = 'feed'; feed.before(lista);
  const { data: tipos } = await banco.from('pendencia_tipo').select('*').eq('ativo', true).order('ordem');
  const hojeISO = new Date().toISOString().slice(0, 10);
  const desenhaChecklist = async () => {
    const { data: ps } = await banco.from('pendencia_cliente').select('empresa_id,tipo,competencia,prazo,recebido_em').order('competencia', { ascending: false });
    lista.innerHTML = (emps || []).map(emp => {
      const minhas = (ps || []).filter(p => p.empresa_id === emp.id && tipos.find(t => t.codigo === p.tipo)?.dia);
      if (!minhas.length) return '';
      const comp = minhas[0].competencia, ordem = p => tipos.find(t => t.codigo === p.tipo).ordem, doMes = minhas.filter(p => p.competencia === comp).sort((a, b) => ordem(a) - ordem(b));
      const faltam = doMes.filter(p => !p.recebido_em).length;
      const linha = (t, p, mes) => {
        const ok = !!p?.recebido_em, atraso = !ok && p?.prazo && p.prazo < hojeISO;
        const tag = ok ? 'enviado' : atraso ? 'enviar · atrasado' : p?.prazo ? 'enviar até ' + dBR(p.prazo).slice(0, 5) : 'enviar';
        return `<label class="fi fi--envio${ok ? ' fi--ok' : atraso ? ' fi--alerta' : ''}"><span class="ico">${I.doc}</span>
          <span class="fi__t"><b>${esc(t.nome)}</b><small>${esc((t.explica || '').replace(/\.$/, ''))}${t.formato ? ' · ' + esc(t.formato) : ''}</small></span><em>${tag}</em>
          <input type="file" hidden data-emp="${emp.id}" data-tipo="${t.codigo}" data-comp="${mes}"></label>`;
      };
      const avulsos = tipos.filter(t => !t.dia && (!t.segmentos || t.segmentos.includes(emp.segmento)));
      return `<div class="fb"><p class="sec">O que mandar · ${mesNome(comp)}${faltam ? ` · faltam ${faltam}` : ' · tudo enviado'}${emps.length > 1 ? ' · ' + esc(emp.nome_fantasia || emp.razao_social) : ''}</p>
        <div class="fl">${doMes.map(p => linha(tipos.find(t => t.codigo === p.tipo), p, comp)).join('')}</div>
        <p class="sec sec--sub">Quando acontecer</p><div class="fl">${avulsos.map(t => linha(t, null, hojeISO.slice(0, 8) + '01')).join('')}</div></div>`;
    }).join('');
  };
  lista.addEventListener('change', async e => {
    const inp = e.target.closest('input[type=file]'); const arq = inp?.files[0]; if (!arq) return;
    const em = inp.closest('.fi').querySelector('em'); em.textContent = 'enviando';
    try { await enviarPendencia(inp.dataset.emp, inp.dataset.tipo, inp.dataset.comp, arq, p => { em.textContent = Math.round(p * 100) + '%'; }); await desenhaChecklist(); }
    catch { em.textContent = 'tente de novo'; }
  });
  await desenhaChecklist();
  await desenhaDocs();
  banco.channel('coleve-pend-cliente').on('postgres_changes', { event: '*', schema: 'public', table: 'pendencia_cliente' }, desenhaChecklist).subscribe();
  banco.channel('coleve-docs-cliente').on('postgres_changes', { event: '*', schema: 'public', table: 'documento' }, desenhaDocs).subscribe();
}

document.getElementById('sair').addEventListener('click', async () => {
  await banco.auth.signOut();
  location.replace('../entrar/');
});
document.body.classList.remove('carregando');
</script>
