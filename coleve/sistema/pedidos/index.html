<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos · Sistema Coleve</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icones/apple_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coleve">
<link rel="icon" href="../../img/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="../sistema.css?v=30">
<link rel="stylesheet" href="../ui.css?v=5">
<link rel="stylesheet" href="pd.css?v=1">
</head>
<body class="ui ui-tf carregando">
<header class="barra">
  <a href="../" class="barra__marca"><img src="../../img/logo_ev.png" alt="Coleve eletromobilidade" width="900" height="270"></a>
  <nav class="barra__nav" aria-label="Sistema">
    <a href="../">Área interna</a>
    <a href="../feed/">Feed</a>
    <a href="../tarefas/">Tarefas</a><a href="../paralegal/">Paralegal</a><a href="../regularidade/">Regularidade</a>
    <a href="../marketing/">Marketing</a>
    <a href="../conversas/">Conversas</a>
    <a href="../clientes/">Clientes</a><a href="../propostas/">Propostas</a></nav>
  <div class="barra__eu">
    <span class="avatar" id="avatar">·</span>
    <div><b id="nome">…</b><small id="papel"></small></div>
    <button class="sair" id="sair" type="button">Sair</button>
  </div>
</header>

<main class="pd pd--larga">
  <div class="pd-topo">
    <h1>Pedidos dos clientes</h1>
    <span class="pd-conta" id="total"></span>
  </div>
  <div class="pd-filtros">
    <div class="pd-abas" role="tablist" aria-label="Situação">
      <button role="tab" data-f="abertos" aria-selected="true">Abertos</button>
      <button role="tab" data-f="feitos" aria-selected="false">Concluídos</button>
      <button role="tab" data-f="todos" aria-selected="false">Todos</button>
    </div>
    <input class="ui-in" type="search" id="busca" placeholder="Buscar cliente ou pedido" aria-label="Buscar">
    <select class="ui-in" id="area" aria-label="Área"><option value="">Área</option></select>
    <label class="tf-chk" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ui-txt-2)"><input type="checkbox" id="urg"> Só urgentes</label>
  </div>
  <div class="pd-rolagem">
    <table class="pd-tab">
      <thead><tr><th class="c-ped">Pedido</th><th class="c-emp">Cliente</th><th class="c-area">Área</th><th class="c-st">Status</th><th class="c-pz">Prazo</th><th class="c-resp">Responsável</th><th class="c-qd">Pedido em</th></tr></thead>
      <tbody id="linhas"></tbody>
    </table>
  </div>
  <p class="pd-ajuda">Cada pedido já é uma tarefa na área certa. Clique para abrir a tarefa. O status do pedido segue o da tarefa.</p>
</main>

<script type="module" src="equipe.js?v=1"></script>
<script type="module" src="../chat-canto.js?v=5"></script>
<script type="module" src="../avisos.js?v=1"></script>
</body>
</html>
