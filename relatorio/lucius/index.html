<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<title>Relatórios · Luciu's Lanches · Kompila</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{--carbono:#0A0B0E;--carbono2:#14161B;--linha:#262A31;--off:#E9EBEE;--mu:#9AA0A8;--verde:#2FD67B;--f-txt:"Inter",system-ui,sans-serif;--f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--carbono);color:var(--off);font-family:var(--f-txt);line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--mu);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.marca b{color:var(--verde)}
h1{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:48px 0 0;text-wrap:balance}
.sub{color:var(--mu);font-size:18px;margin:16px 0 0;max-width:60ch}
.lista{list-style:none;margin:48px 0 0;padding:0;border-top:1px solid var(--linha)}
.lista a{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;align-items:center;padding:24px 4px;border-bottom:1px solid var(--linha);color:inherit;text-decoration:none;transition:background .15s}
.lista a:hover,.lista a:focus-visible{background:var(--carbono2);outline:none}
.dt{font-family:var(--f-num);font-weight:600;color:var(--verde);font-variant-numeric:tabular-nums}
.tt{font-weight:700;font-size:19px}
.tt span{display:block;font-weight:400;font-size:15px;color:var(--mu);margin-top:2px}
.vai{font-family:var(--f-num);color:var(--mu)}
@media (max-width:600px){.lista a{grid-template-columns:minmax(0,1fr) auto}.dt{grid-column:1 / -1}}
</style>
</head>
<body>
<main class="wrap">
  <div class="marca"><span><b>[</b> kompila <b>]</b> · relatórios</span><span>Luciu's Lanches</span></div>
  <h1>Relatórios do Luciu's</h1>
  <p class="sub">Os números da loja contados pela Kompila: pedidos, vendas e o trabalho da Liz no WhatsApp. O mais novo fica em cima.</p>
  <ul class="lista">
    <li><a href="/relatorio/lucius/2026-11-16/"><span class="dt">16/11/2026</span><span class="tt">O primeiro dia da Liz<span>112 pedidos, 39 pelo WhatsApp, resposta em 21 segundos</span></span><span class="vai">→</span></a></li>
  </ul>
</main>
</body>
</html>
